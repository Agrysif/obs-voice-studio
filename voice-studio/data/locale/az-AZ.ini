VoiceStudio.FilterName="🎙 Səs Studiyası"
VoiceStudio.Description="Səsyazma və strimlər üçün studiya səs emalı: Sİ ilə küy təmizləmə, ağıllı avtomatik tənzimləmə, ekvalayzer, kompressor, de-esser, səs dəyişdirmə."

VoiceStudio.Unit.dB=" dB"
VoiceStudio.Unit.Hz=" Hs"
VoiceStudio.Unit.ms=" ms"
VoiceStudio.Unit.Percent=" %"
VoiceStudio.Unit.Semitones=" yt"

VoiceStudio.Mode="Tənzimləmə rejimi"
VoiceStudio.Mode.Simple="🙂 Sadə — yalnız ən vacibi"
VoiceStudio.Mode.Expert="🛠 Ekspert — bütün parametrlər"
VoiceStudio.Mode.Tip="Sadə rejim yalnız başa düşülən sürgüləri göstərir. Ekspert rejimi tezlikləri, keyfiyyət əmsalını (Q), atak və buraxma vaxtını da əlavə edir. Rejimi dəyişmək səsi dəyişmir."

VoiceStudio.Guide="Necə istifadə etməli — 3 addım:\n1. Hazır səslənmə üslubunu seçin.\n2. «✨ Ağıllı tənzimləmə» düyməsini basın və 10 saniyə adi səslə, fasilələrlə danışın.\n3. «🎧 Özünü dinlə» düyməsini basın, qulaqlıq taxın və sürgüləri zövqünüzə görə tənzimləyin.\nSiçanı adın yanındakı ipucu nişanının üzərinə gətirin — orada hər sürgünün nə etdiyi izah olunub."

VoiceStudio.Preset="Səslənmə üslubu"
VoiceStudio.Preset.Tip="Müxtəlif işlər üçün hazır tənzimləmələr. Üslub seçəndə aşağıdakı sürgülər avtomatik qurulur. Mikrofonun səs səviyyəsi və qeytin həddi isə dəyişmir — onları «Ağıllı tənzimləmə» seçir."
VoiceStudio.Preset.Natural="🌿 Təbii və təmiz"
VoiceStudio.Preset.Natural.Tip="Heç bir «effekt» olmadan təmiz, təbii səs: küyü, uğultunu və fısıltılı səsləri təmizləyir, aydınlığı bir az artırır. Demək olar ki, hər şey üçün yaxşıdır."
VoiceStudio.Preset.Podcast="🎙 Podkast / radio aparıcısı"
VoiceStudio.Preset.Podcast.Tip="Radiodakı kimi sıx, yaxın, «bahalı» səs: daha məxməri aşağı tonlar, bərabər səs gücü, yüngül lampa istiliyi."
VoiceStudio.Preset.Stream="🎮 Strim və oyunlar"
VoiceStudio.Preset.Stream.Tip="Maksimum aydınlıq və heç bir küy: səs oyunun səsini yarıb keçir, klaviatura və ventilyator eşidilmir."
VoiceStudio.Preset.Deep="🌙 Dərin və məxməri"
VoiceStudio.Preset.Deep.Tip="Səs tembr sayəsində daha qalın və ciddi səslənir (tonu dəyişmədən): daha çox bas, daha isti, daha yumşaq."
VoiceStudio.Preset.Bright="✨ Parlaq və cingiltili"
VoiceStudio.Preset.Bright.Tip="Təravətli, «havalı», parıltılı səs — boğuq mikrofonlar və tutqun səslər üçün yaxşıdır."
VoiceStudio.Preset.Noisy="🏠 Səs-küylü otaq"
VoiceStudio.Preset.Noisy.Tip="Səs-küylü otaq üçün: ventilyator, küçə, mexaniki klaviatura. Ən güclü küy təmizləmə və sərt qeyt."
VoiceStudio.Preset.Minimal="🧹 Yalnız küyü təmizlə"
VoiceStudio.Preset.Minimal.Tip="Səs dəyişmir — neyroşəbəkə yalnız küyü və aşağı uğultunu təmizləyir. Mikrofonunu olduğu kimi sevənlər üçün."
VoiceStudio.Preset.Phone="📞 Effekt: telefon / ratsiya"
VoiceStudio.Preset.Phone.Tip="Yüngül xırıltılı, dar «telefon» səsi — səhnəciklər və videolar üçün."
VoiceStudio.Preset.Monster="👹 Effekt: monstr"
VoiceStudio.Preset.Monster.Tip="Qalın, nəhəng səs: ton −5, səsin «ölçüsü» daha böyük. Zarafatlar və personajlar üçün."
VoiceStudio.Preset.Cartoon="🐿 Effekt: cizgi filmi"
VoiceStudio.Preset.Cartoon.Tip="Cizgi filmi personajının incə, şən səsi."
VoiceStudio.Preset.Custom="🛠 Öz tənzimləməm"
VoiceStudio.Preset.Custom.Tip="Sürgülər dəyişmir — hər şeyi özünüz tənzimləyin."

VoiceStudio.Calib.Start="✨ Ağıllı tənzimləmə — səsimə görə (10 san)"
VoiceStudio.Calib.Stop="⏹ Analizi dayandır"
VoiceStudio.Calib.Tip="Plagin 10 saniyə mikrofonu dinləyəcək. Neyroşəbəkə nitqi fasilələrdən özü ayıracaq, səsin gücünü, otaq küyünü, fısıltılı səsləri və tembri ölçəcək, sonra gücləndirməni, küy təmizləməni, qeyti, kompressoru, de-esseri və ekvalayzeri tənzimləyəcək. Təkrar işə sala bilərsiniz — düzəlişlər üst-üstə yığılmır."
VoiceStudio.Calib.Hint="Yuxarıdakı düyməni basın və kiçik fasilələrlə adi səslə danışın — məsələn, nə çəkəcəyinizdən danışın."
VoiceStudio.Calib.Listening="🎙 Dinləyirəm… Adi səslə danışın, ifadələr arasında fasilə verin. %d san qaldı.\n(Geri sayım dayanıbsa — filtrin aktiv olduğunu və mikrofonun işlədiyini yoxlayın.)"
VoiceStudio.Calib.Cancelled="Analiz dayandırıldı. Tənzimləmələr dəyişmədi."
VoiceStudio.Calib.NoVoice="⚠ Səsi eşitmək alınmadı. Mənbədə düzgün mikrofonun seçildiyini və onun Windows-da söndürülmədiyini yoxlayın, analiz zamanı danışın. Sonra tənzimləməni yenidən başladın."
VoiceStudio.Calib.Done="✅ Hazırdır! Səs: %.0f dB, otaq küyü: %.0f dB (ehtiyat %.0f dB). Mikrofon gücləndirməsi: %+.1f dB.\nSürgülər səsinizə uyğunlaşdırıldı — dinləməni yandırın və qiymətləndirin."
VoiceStudio.Calib.TooQuiet="⚠ Mikrofon çox zəif eşidilir. Onun səviyyəsini Windows-da (Parametrlər → Səs → Daxiletmə → Səs səviyyəsi) və ya səs kartında artırın və tənzimləməni təkrarlayın."
VoiceStudio.Calib.Clipping="⚠ Mikrofon həddən artıq yüklənir (uca sözlərdə xırıldayır). Onun səviyyəsini Windows-da və ya səs kartında azaldın və tənzimləməni təkrarlayın."
VoiceStudio.Calib.Noisy="ℹ Otaq kifayət qədər səs-küylüdür — küy təmizləmə tam gücə qoyuldu. «🏠 Səs-küylü otaq» üslubunu sınayın."
VoiceStudio.Calib.QuietRoom="👍 Otaqda əla sakitlikdir."

VoiceStudio.Monitor.On="🎧 Özünü dinlə (dinləməni yandır)"
VoiceStudio.Monitor.Off="🔇 Dinləməni söndür"
VoiceStudio.Monitor.Tip="Bu mikrofon üçün OBS-də «Monitorinq və çıxış» rejimini yandırır: özünüzü artıq emal olunmuş halda eşidirsiniz və sürgüləri necə tənzimləməyi dərhal başa düşürsünüz. Mütləq qulaqlıqla!"
VoiceStudio.Monitor.Info="Dinləmə səsi bura gedir: %s. Qulaqlıq taxın — əks halda mikrofon dinamikləri eşidəcək və əks-səda və ya fit səsi yaranacaq. Cihazı «Tənzimləmələr → Audio → Təkmil» bölməsində dəyişmək olar. Dinləyərkən kiçik gecikmə normaldır, səsyazmada o olmur."
VoiceStudio.Monitor.DefaultDevice="standart cihaz"

VoiceStudio.Bypass="🔁 Orijinalla müqayisə et (emalı müvəqqəti söndür)"
VoiceStudio.Bypass.Tip="Səsi emalsız eşitmək üçün işarə qoyun, geri qaytarmaq üçün işarəni götürün. Belə səsin yaxşılaşıb-yaxşılaşmadığını asanlıqla anlayarsınız."

VoiceStudio.InputGain="Mikrofonun səs səviyyəsi"
VoiceStudio.InputGain.Tip="Mikrofon siqnalını emaldan əvvəl nə qədər gücləndirmək. «Ağıllı tənzimləmə» bunu özü qurur. Səs zəifdirsə — artırın, xırıldayırsa — azaldın."

VoiceStudio.Denoise="🤖 Sİ ilə küy təmizləmə (RNNoise 0.2 neyroşəbəkəsi)"
VoiceStudio.Denoise.Tip="Neyroşəbəkə səsi küydən ayırır və ventilyatoru, kompüter uğultusunu, küçəni, klaviaturanı, otaq əks-sədasını təmizləyir."
VoiceStudio.Denoise.Amount="Güc"
VoiceStudio.Denoise.Amount.Tip="100% — küyü tam təmizləmək. Səs «borudan gəlirmiş kimi» səslənirsə və ya söz sonluqlarını udursa — 70–85% səviyyəsinə endirin: bir az təbii fon qalacaq."

VoiceStudio.Gate="🚪 Küy qeyti (fasilələrdə sakitlik)"
VoiceStudio.Gate.Tip="Siz susanda səsi azaldır: nəfəs, siçan klikləri, ifadələr arasında otaq səsləri."
VoiceStudio.Gate.Mode="Danışdığınızı necə anlamalı"
VoiceStudio.Gate.Mode.Voice="🤖 Səsə görə (Sİ) — tövsiyə olunur"
VoiceStudio.Gate.Mode.Level="📶 Səs gücünə görə (klassik)"
VoiceStudio.Gate.Mode.Both="🤖+📶 Səs və güc (səs-küylü otaqlar üçün)"
VoiceStudio.Gate.Mode.Tip="«Səsə görə» — neyroşəbəkə məhz nitqi eşidir və klaviatura səsinə qeyti açmır. «Səs gücünə görə» — həddən uca olan hər şey. «Səs və güc» — hər iki şərt birlikdə: ən sərt rejim."
VoiceStudio.Gate.Threshold="Sakitlik həddi"
VoiceStudio.Gate.Threshold.Tip="Bu səviyyədən zəif olan hər şey fasilə sayılır. Zəif sözlər kəsilirsə — sola çəkin. İfadələr arasında küy eşidilirsə — sağa. «Ağıllı tənzimləmə» bunu özü seçir."
VoiceStudio.Gate.Range="Fasilələri nə qədər azaltmalı"
VoiceStudio.Gate.Range.Tip="−20 dB — fasilələr xeyli zəif, amma təbii səslənir. −60 dB — tam sakitlik. 0 — qeyt heç nə etmir."
VoiceStudio.Gate.VadSens="Səsə həssaslıq"
VoiceStudio.Gate.VadSens.Tip="Yüksək — qeyt hətta pıçıltıya açılır, aşağı — yalnız inamlı nitqə."
VoiceStudio.Gate.Attack="Atak (açılma)"
VoiceStudio.Gate.Attack.Tip="Danışmağa başlayanda qeyt nə qədər tez açılır."
VoiceStudio.Gate.Hold="Saxlama"
VoiceStudio.Gate.Hold.Tip="İfadə bitəndən sonra qeyt nə qədər açıq qalır — sözlərin sonu kəsilməsin deyə."
VoiceStudio.Gate.Release="Buraxma (bağlanma)"
VoiceStudio.Gate.Release.Tip="İfadədən sonra qeyt nə qədər rəvan bağlanır."

VoiceStudio.Eq="🎚 Ekvalayzer (səsin tembri)"
VoiceStudio.Eq.Tip="Səsin çalarını dəyişir: daha çox və ya az bas, aydınlıq, «hava». «Ağıllı tənzimləmə» onu mikrofonunuza uyğunlaşdırır."
VoiceStudio.Hpf="Aşağı uğultunu və taqqıltıları təmizlə"
VoiceStudio.Hpf.Tip="Ən aşağı tezlikləri kəsir: uğultu, stola dəyən zərbələr, ştativin titrəməsi, mikrofona nəfəsdən gələn «puf» səsləri. Demək olar ki, həmişə aktiv saxlamağa dəyər."
VoiceStudio.Hpf.Freq="Bundan aşağını kəs"
VoiceStudio.Hpf.Freq.Tip="80 Hs — əksər səslər üçün. 100–120 Hs — uğultu çoxdursa. Qalın kişi səsləri üçün 90 Hs-dən yuxarı qaldırmayın."
VoiceStudio.Hpf.Slope="Kəsmənin dikliyi"
VoiceStudio.Hpf.Slope12="12 dB/okt — yumşaq"
VoiceStudio.Hpf.Slope24="24 dB/okt — kəskin"
VoiceStudio.Eq.Low="Dərinlik (bas)"
VoiceStudio.Eq.Low.Tip="Artı — səs daha ciddi və «məxməri» olur. Mənfi — səs gurultulu çıxırsa və ya mikrofon çox yaxındırsa."
VoiceStudio.Eq.LowFreq="«Dərinlik» tezliyi"
VoiceStudio.Eq.Mud="Boğuqluq (gurultu)"
VoiceStudio.Eq.Mud.Tip="Mənfi otağın «karton», «çəllək» səsini təmizləyir — səs daha təmiz olur. Adətən −2 ilə −4 arası qoyulur."
VoiceStudio.Eq.MudFreq="«Boğuqluq» tezliyi"
VoiceStudio.Eq.MudQ="«Boğuqluq» eni"
VoiceStudio.Eq.Q.Tip="Zolağın eni (keyfiyyət əmsalı): az — daha geniş və yumşaq, çox — dar və nöqtəvi."
VoiceStudio.Eq.Nasal="Burun səsi"
VoiceStudio.Eq.Nasal.Tip="Mənfi «burundan gələn», «telefon» çalarını təmizləyir. Artı səsin ortasını daha sıx edir."
VoiceStudio.Eq.NasalFreq="«Burun səsi» tezliyi"
VoiceStudio.Eq.NasalQ="«Burun səsi» eni"
VoiceStudio.Eq.Pres="Aydınlıq (anlaşıqlılıq)"
VoiceStudio.Eq.Pres.Tip="Artı — sözlər daha aydın və «yaxın» səslənir, səs musiqidə və oyunda batmır. Səs kəskinləşirsə — azaldın."
VoiceStudio.Eq.PresFreq="«Aydınlıq» tezliyi"
VoiceStudio.Eq.PresQ="«Aydınlıq» eni"
VoiceStudio.Eq.Air="Hava (parıltı)"
VoiceStudio.Eq.Air.Tip="Artı təravət və «bahalı» studiya parıltısı əlavə edir. Fısıltı eşidilməyə başlayırsa — azaldın."
VoiceStudio.Eq.AirFreq="«Hava» tezliyi"
VoiceStudio.Eq.Lpf="Bundan yuxarını kəs"
VoiceStudio.Eq.Lpf.Tip="Ən yüksək tezlikləri təmizləyir. 20000 Hs — söndürülüb. 3400 Hs — telefon effekti."

VoiceStudio.Deess="🐍 Kəskin fısıltılı səsləri təmizlə (s, ş, ç)"
VoiceStudio.Deess.Tip="De-esser səsin qalan hissəsinə toxunmadan yalnız kəskin fısıltılı və fışıltılı səsləri azaldır."
VoiceStudio.Deess.Amount="Güc"
VoiceStudio.Deess.Amount.Tip="Çox — «s» və «ş» səslərini daha güclü yumşaldır. Pəltək kimi səslənməyə başlasanız — azaldın."
VoiceStudio.Deess.Freq="Fısıltılı səslərin tezliyi"
VoiceStudio.Deess.Freq.Tip="Fısıltılı səslər hansı tezlikdən başlayır. Adətən 5000–7000 Hs: qadın səslərində daha yuxarı, kişi səslərində daha aşağı."

VoiceStudio.Comp="🗜 Səs gücünü bərabərləşdirmə (kompressor)"
VoiceStudio.Comp.Tip="Zəif və uca sözləri güc baxımından bir-birinə yaxınlaşdırır: səs bərabər, sıx və «radio kimi» səslənir, tamaşaçı səsi artırıb-azaltmalı olmur."
VoiceStudio.Comp.Amount="Güc"
VoiceStudio.Comp.Amount.Tip="30–40% — təbii. 50–70% — radiodakı kimi sıx. Daha yuxarı — güclü effekt. Ümumi səs gücü avtomatik tənzimlənir."
VoiceStudio.Comp.Attack="Atak"
VoiceStudio.Comp.Attack.Tip="Kompressor uca səsə nə qədər tez reaksiya verir. Az — daha sərt nəzarət, çox — sözlərin başlanğıcı daha canlı."
VoiceStudio.Comp.Release="Buraxma"
VoiceStudio.Comp.Release.Tip="Uca səsdən sonra kompressor nə qədər tez «buraxır»."

VoiceStudio.Warmth="🔥 İstilik (lampa çaları)"
VoiceStudio.Warmth.Tip="Lampalı studiya avadanlığında olduğu kimi yumşaq harmoniklər əlavə edir: səs daha sıx və məxməri olur."
VoiceStudio.Warmth.Amount="Güc"
VoiceStudio.Warmth.Amount.Tip="20–40% — yüngül istilik. Daha çox — hiss olunan «vintaj» xırıltı."

VoiceStudio.Voice="🎭 Səs dəyişdirmə"
VoiceStudio.Voice.Tip="Səsin tonunu və «ölçüsünü» dəyişir. Formantların qorunması səsi təbii saxlayır — burunduq effekti olmadan."
VoiceStudio.Voice.Pitch="Səs tonu"
VoiceStudio.Voice.Pitch.Tip="Yarımtonlarla: −2 — bir az aşağı, −12 — bir oktava aşağı, +12 — bir oktava yuxarı. Təbii səs üçün ±3 daxilində qalın."
VoiceStudio.Voice.Formant="Tembr (səsin «ölçüsü»)"
VoiceStudio.Voice.Formant.Tip="Tonu dəyişmədən çaları dəyişir: mənfi — səs «daha böyük», yaşlı və kişi kimi, artı — «daha kiçik», cavan."
VoiceStudio.Voice.Preserve="Təbiiliyi qoru (formantlar)"
VoiceStudio.Voice.Preserve.Tip="Aktiv — ton dəyişəndə tembr sizinki olaraq qalır. Deaktiv — klassik effekt: yuxarı — burunduq, aşağı — yavaşıdılmış lent."
VoiceStudio.Voice.Quality="Keyfiyyət"
VoiceStudio.Voice.Quality.High="Yüksək (gecikmə ~43 ms)"
VoiceStudio.Voice.Quality.Fast="Sürətli (gecikmə ~21 ms)"
VoiceStudio.Voice.Quality.Tip="Yüksək keyfiyyət qalın səslərdə daha yaxşı səslənir. Sürətli rejim özünüzü dinləyərkən daha az gecikmə verir."
VoiceStudio.Voice.Note="ℹ Səs dəyişdirmə səsə kiçik gecikmə əlavə edir. Videoda dodaqlar səslə bir az üst-üstə düşmürsə, OBS-də video və ya mikrofon üçün «Təkmil audio xüsusiyyətləri → Sinxronizasiya sürüşməsi» təyin edin."

VoiceStudio.OutputGain="Yekun səs səviyyəsi"
VoiceStudio.OutputGain.Tip="Plaginin çıxışında səsin gücü. OBS mikserindəki indikatora baxın: nitq sarı zonaya çatmalıdır, amma qırmızıya yox."
VoiceStudio.Limiter="🛡 Həddən artıq yüklənmədən qoruma (limiter)"
VoiceStudio.Limiter.Tip="Qışqıranda, güləndə və ya öskürəndə səsin «xırıldamasına» imkan vermir. Həmişə aktiv saxlamaq daha yaxşıdır."
VoiceStudio.Limiter.Ceiling="Səs gücünün tavanı"
VoiceStudio.Limiter.Ceiling.Tip="Çıxışda maksimum səviyyə. −1 dB — standart təhlükəsiz ehtiyat."

VoiceStudio.Live.In="Giriş"
VoiceStudio.Live.Out="Çıxış"
VoiceStudio.Live.Voice="Sİ səsi eşidir"
VoiceStudio.Live.Silence="Sakitlik"
VoiceStudio.Live.NoSignal="Mikrofondan səs gəlmir"
VoiceStudio.Live.Off="Filtr söndürülüb"
VoiceStudio.Live.Squeeze="sıxılma %1 dB"
VoiceStudio.Live.GatePause="fasilə azaldılıb"
VoiceStudio.Live.EqHint="Ekvalayzer: nöqtələri siçanla çəkin — sola-sağa tezlik, yuxarı-aşağı səs gücü, nöqtənin üzərində təkərcik — en, iki dəfə klik — sıfırlama. Boz rənglə səsinizin spektri göstərilir."
VoiceStudio.Live.EqOff="Ekvalayzer söndürülüb — onu aşağıdakı «Ekvalayzer» bölməsində yandırın"
VoiceStudio.Live.Hpf="Uğultu kəsimi"
VoiceStudio.Live.Low="Dərinlik"
VoiceStudio.Live.Mud="Boğuqluq"
VoiceStudio.Live.Nasal="Burun səsi"
