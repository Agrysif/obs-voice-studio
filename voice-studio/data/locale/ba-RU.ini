VoiceStudio.Voice.Quality.Fast="Тиҙ (тотҡарлыҡ ~21 мс)"
VoiceStudio.Voice.Quality.Tip="Юғары сифат түбән тауыштарҙа яҡшыраҡ яңғырай. Тиҙ режим үҙеңде тыңлағанда тотҡарлыҡты кәметә."
VoiceStudio.Voice.Note="ℹ Тауышты үҙгәртеү аудиоға бәләкәй тотҡарлыҡ өҫтәй. Яҙмала ирендәр тауыш менән бер аҙ тап килмәһә, OBS-та видео йәки микрофон өсөн «Киңәйтелгән аудио үҙенсәлектәре → Синхронлаштырыу күсеше» көйләгеҙ."

VoiceStudio.OutputGain="Һуңғы тауыш көсө"
VoiceStudio.OutputGain.Tip="Плагин сығышындағы тауыш көсө. OBS микшерындағы индикаторҙы күҙәтегеҙ: һөйләм һары зонаға етергә тейеш, әммә ҡыҙылға түгел."
VoiceStudio.Limiter="🛡 Артыҡ йөкләнештән һаҡлау (лимитер)"
VoiceStudio.Limiter.Tip="Ҡысҡырғанда, көлгәндә йәки йүткергәндә тауыштың «ҡарлығыуына» юл ҡуймай. Һәр ваҡыт ҡабыҙылған килеш тотоу яҡшыраҡ."
