VoiceStudio.Voice="🎭 Тауышты үҙгәртеү"
VoiceStudio.Voice.Tip="Тауыштың бейеклеген һәм «ҙурлығын» үҙгәртә. Форманттарҙы һаҡлау тауышты тәбиғи ҡалдыра — бурундыҡ эффектынан башҡа."
VoiceStudio.Voice.Pitch="Тауыш бейеклеге"
VoiceStudio.Voice.Pitch.Tip="Ярымтондарҙа: −2 — саҡ ҡына түбәнерәк, −12 — бер октаваға түбәнерәк, +12 — бер октаваға юғарыраҡ. Тәбиғи яңғырау өсөн ±3 сиктәрендә ҡалығыҙ."
VoiceStudio.Voice.Formant="Тембр (тауыш «ҙурлығы»)"
VoiceStudio.Voice.Formant.Tip="Бейеклекте үҙгәртмәйенсә төҫмөрҙө үҙгәртә: минус — тауыш «ҙурыраҡ», өлкәнерәк һәм йыуаныраҡ, плюс — «бәләкәйерәк», йәшерәк."
VoiceStudio.Voice.Preserve="Тәбиғилекте һаҡлау (форманттар)"
VoiceStudio.Voice.Preserve.Tip="Ҡабыҙылған — бейеклек үҙгәргәндә тембр һеҙҙеке булып ҡала. Һүндерелгән — классик эффект: өҫкә — бурундыҡ, аҫҡа — әкренәйтелгән таҫма."
VoiceStudio.Voice.Quality="Сифат"
