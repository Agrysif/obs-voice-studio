VoiceStudio.Deess.Freq.Tip="Ыҫылдаулы өндәр ниндәй йышлыҡтан башлана. Ғәҙәттә 5000–7000 Гц: ҡатын-ҡыҙ тауыштарында юғарыраҡ, ир-аттарҙыҡында түбәнерәк."

VoiceStudio.Comp="🗜 Тауыш көсөн тигеҙләү (компрессор)"
