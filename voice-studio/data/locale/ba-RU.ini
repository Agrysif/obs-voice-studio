VoiceStudio.Comp.Amount="Көс"
VoiceStudio.Comp.Amount.Tip="30–40% — тәбиғи. 50–70% — радиолағыса тығыҙ. Юғарыраҡ — көслө эффект. Дөйөм тауыш көсө үҙенән-үҙе көйләнә."
VoiceStudio.Comp.Attack="Атака"
VoiceStudio.Comp.Attack.Tip="Компрессор ҡаты тауышҡа ни тиклем тиҙ яуап бирә. Кәмерәк — контроль ҡатыраҡ, күберәк — һүҙ баштары йәнлерәк."
VoiceStudio.Comp.Release="Ҡайтыу"
VoiceStudio.Comp.Release.Tip="Ҡаты тауыштан һуң компрессор ни тиклем тиҙ «ебәрә»."

