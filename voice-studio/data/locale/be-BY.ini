VoiceStudio.FilterName="🎙 Галасавая студыя"
VoiceStudio.Description="Студыйная апрацоўка голасу для запісу і стрымаў: ШІ-шумапрыглушэнне, разумная аўтаналада, эквалайзер, кампрэсар, дэ-эсер, змена голасу."

VoiceStudio.Unit.dB=" дБ"
VoiceStudio.Unit.Hz=" Гц"
VoiceStudio.Unit.ms=" мс"
VoiceStudio.Unit.Percent=" %"
VoiceStudio.Unit.Semitones=" пт"

VoiceStudio.Mode="Рэжым налад"
VoiceStudio.Mode.Simple="🙂 Просты — толькі галоўнае"
VoiceStudio.Mode.Expert="🛠 Эксперт — усе параметры"
VoiceStudio.Mode.Tip="Просты рэжым паказвае толькі зразумелыя паўзункі. Эксперт дадае частоты, дабротнасць, час атакі і аднаўлення. Гук ад пераключэння рэжыму не змяняецца."

VoiceStudio.Guide="Як карыстацца — 3 крокі:\n1. Выберыце гатовы стыль гучання.\n2. Націсніце «✨ Разумная налада» і 10 секунд гаварыце звычайным голасам, з паўзамі.\n3. Націсніце «🎧 Слухаць сябе», надзеньце навушнікі і рухайце паўзункі на свой густ.\nНавядзіце мыш на значок падказкі побач з назвай — там растлумачана, што робіць кожны паўзунок."

VoiceStudio.Preset="Стыль гучання"
VoiceStudio.Preset.Tip="Гатовыя налады для розных задач. Калі выбраць стыль, паўзункі ніжэй выставяцца аўтаматычна. Гучнасць мікрафона і парог гейта пры гэтым не змяняюцца — іх падбірае «Разумная налада»."
VoiceStudio.Preset.Natural="🌿 Натуральны і чысты"
VoiceStudio.Preset.Natural.Tip="Чысты натуральны голас без «эфектаў»: прыбірае шум, гул і шыпячыя, крыху дадае разборлівасці. Падыходзіць амаль для ўсяго."
VoiceStudio.Preset.Podcast="🎙 Падкаст / радыёвядучы"
VoiceStudio.Preset.Podcast.Tip="Шчыльны, блізкі, «дарагі» голас як на радыё: больш аксаміту ўнізе, роўная гучнасць, лёгкае лямпавае цяпло."
VoiceStudio.Preset.Stream="🎮 Стрым і гульні"
VoiceStudio.Preset.Stream.Tip="Максімум разборлівасці і ніякага шуму: голас прабіваецца праз гук гульні, клавіятуру і вентылятар не чуваць."
VoiceStudio.Preset.Deep="🌙 Глыбокі аксамітны"
VoiceStudio.Preset.Deep.Tip="Голас гучыць ніжэй і больш салідна дзякуючы тэмбру (без змены вышыні): больш нізоў, цяплей, мякчэй."
VoiceStudio.Preset.Bright="✨ Яркі і звонкі"
VoiceStudio.Preset.Bright.Tip="Свежы, «паветраны» голас з бляскам — добра для глухіх мікрафонаў і цёмных галасоў."
VoiceStudio.Preset.Noisy="🏠 Шумны пакой"
VoiceStudio.Preset.Noisy.Tip="Для шумнага памяшкання: вентылятар, вуліца, механічная клавіятура. Самае моцнае шумапрыглушэнне і строгі гейт."
VoiceStudio.Preset.Minimal="🧹 Толькі прыбраць шум"
VoiceStudio.Preset.Minimal.Tip="Голас не змяняецца — толькі нейрасетка прыбірае шум і нізкі гул. Для тых, каму падабаецца свой мікрафон як ёсць."
VoiceStudio.Preset.Phone="📞 Эфект: тэлефон / рацыя"
VoiceStudio.Preset.Phone.Tip="Вузкі «тэлефонны» гук з лёгкай хрыпатой — для сцэнак і ролікаў."
VoiceStudio.Preset.Monster="👹 Эфект: монстр"
VoiceStudio.Preset.Monster.Tip="Нізкі велізарны голас: вышыня −5, «памер» голасу большы. Для жартаў і персанажаў."
VoiceStudio.Preset.Cartoon="🐿 Эфект: мультяшны"
VoiceStudio.Preset.Cartoon.Tip="Высокі вясёлы голас персанажа мультфільма."
VoiceStudio.Preset.Custom="🛠 Свая налада"
VoiceStudio.Preset.Custom.Tip="Паўзункі не змяняюцца — наладжвайце ўсё самі."

VoiceStudio.Calib.Start="✨ Разумная налада пад мой голас (10 с)"
VoiceStudio.Calib.Stop="⏹ Спыніць аналіз"
VoiceStudio.Calib.Tip="Плагін будзе слухаць мікрафон 10 секунд. Нейрасетка сама аддзеліць маўленне ад паўз, вымерае гучнасць голасу, шум пакоя, шыпячыя і тэмбр, а потым падладзіць узмацненне, шумапрыглушэнне, гейт, кампрэсар, дэ-эсер і эквалайзер. Можна запускаць паўторна — папраўкі не назапашваюцца."
VoiceStudio.Calib.Hint="Націсніце кнопку вышэй і гаварыце звычайным голасам з невялікімі паўзамі — напрыклад, раскажыце, што збіраецеся запісваць."
VoiceStudio.Calib.Listening="🎙 Слухаю… Гаварыце звычайным голасам, рабіце паўзы паміж фразамі. Засталося %d с.\n(Калі адлік стаіць на месцы — праверце, што фільтр уключаны і мікрафон працуе.)"
VoiceStudio.Calib.Cancelled="Аналіз спынены. Налады не змяніліся."
VoiceStudio.Calib.NoVoice="⚠ Не атрымалася пачуць голас. Праверце, што ў крыніцы выбраны патрэбны мікрафон, ён не выключаны ў Windows, і гаварыце падчас аналізу. Потым запусціце наладу яшчэ раз."
VoiceStudio.Calib.Done="✅ Гатова! Голас: %.0f дБ, шум пакоя: %.0f дБ (запас %.0f дБ). Узмацненне мікрафона: %+.1f дБ.\nПаўзункі падладжаны пад ваш голас — уключыце праслухоўванне і ацаніце."
VoiceStudio.Calib.TooQuiet="⚠ Мікрафон гучыць вельмі ціха. Павялічце яго ўзровень у Windows (Параметры → Гук → Увод → Гучнасць) або на гукавой карце і паўтарыце наладу."
VoiceStudio.Calib.Clipping="⚠ Мікрафон перагружаецца (хрыпіць на гучных словах). Паменшыце яго ўзровень у Windows або на гукавой карце і паўтарыце наладу."
VoiceStudio.Calib.Noisy="ℹ У пакоі даволі шумна — шумапрыглушэнне ўключана на поўную. Паспрабуйце стыль «🏠 Шумны пакой»."
VoiceStudio.Calib.QuietRoom="👍 У пакоі выдатная цішыня."

VoiceStudio.Monitor.On="🎧 Слухаць сябе (уключыць праслухоўванне)"
VoiceStudio.Monitor.Off="🔇 Выключыць праслухоўванне"
VoiceStudio.Monitor.Tip="Уключае ў OBS «Маніторынг і вывад» для гэтага мікрафона: вы чуеце сябе ўжо з апрацоўкай і адразу разумееце, як рухаць паўзункі. Абавязкова ў навушніках!"
VoiceStudio.Monitor.Info="Гук праслухоўвання ідзе на: %s. Надзеньце навушнікі — інакш мікрафон пачуе калонкі, і з'явіцца рэха або свіст. Прыладу можна змяніць у «Налады → Аўдыя → Пашыраныя». Невялікая затрымка пры праслухоўванні — гэта нармальна, у запісе яе няма."
VoiceStudio.Monitor.DefaultDevice="прылада па змаўчанні"

VoiceStudio.Bypass="🔁 Параўнаць з арыгіналам (часова выключыць апрацоўку)"
VoiceStudio.Bypass.Tip="Пастаўце птушку, каб пачуць голас без апрацоўкі, зніміце — каб вярнуць. Так лёгка зразумець, ці стала лепш."

VoiceStudio.InputGain="Гучнасць мікрафона"
VoiceStudio.InputGain.Tip="Наколькі ўзмацніць сігнал мікрафона да апрацоўкі. «Разумная налада» выстаўляе яго сама. Калі голас ціхі — павялічце, калі хрыпіць — паменшыце."

VoiceStudio.Denoise="🤖 ШІ-шумапрыглушэнне (нейрасетка RNNoise 0.2)"
VoiceStudio.Denoise.Tip="Нейрасетка адрознівае голас ад шуму і прыбірае вентылятар, гул камп'ютара, вуліцу, клавіятуру, рэха пакоя."
VoiceStudio.Denoise.Amount="Сіла"
VoiceStudio.Denoise.Amount.Tip="100% — прыбраць шум цалкам. Калі голас гучыць «як у трубе» або глытае канчаткі — паменшыце да 70–85%: крыху натуральнага фону застанецца."

VoiceStudio.Gate="🚪 Шумавы гейт (цішыня ў паўзах)"
VoiceStudio.Gate.Tip="Прыглушае гук, калі вы маўчыце: дыханне, пстрычкі мышы, гукі пакоя паміж фразамі."
VoiceStudio.Gate.Mode="Як вызначаць, што вы гаворыце"
VoiceStudio.Gate.Mode.Voice="🤖 Па голасе (ШІ) — рэкамендуецца"
VoiceStudio.Gate.Mode.Level="📶 Па гучнасці (класічны)"
VoiceStudio.Gate.Mode.Both="🤖+📶 Голас і гучнасць (для шумных пакояў)"
VoiceStudio.Gate.Mode.Tip="«Па голасе» — нейрасетка чуе менавіта маўленне і не адкрывае гейт на стук клавіш. «Па гучнасці» — усё, што гучней за парог. «Голас і гучнасць» — абедзве ўмовы адразу: самы строгі варыянт."
VoiceStudio.Gate.Threshold="Парог цішыні"
VoiceStudio.Gate.Threshold.Tip="Усё, што цішэй за гэты ўзровень, лічыцца паўзай. Калі абразаюцца ціхія словы — перасуньце ўлева. Калі паміж фразамі чуваць шум — управа. Падбіраецца «Разумнай наладай»."
VoiceStudio.Gate.Range="Наколькі прыглушаць паўзы"
VoiceStudio.Gate.Range.Tip="−20 дБ — паўзы прыкметна цішэй, але гучыць натуральна. −60 дБ — поўная цішыня. 0 — гейт нічога не робіць."
VoiceStudio.Gate.VadSens="Адчувальнасць да голасу"
VoiceStudio.Gate.VadSens.Tip="Вышэй — гейт адкрываецца нават на шэпт, ніжэй — толькі на ўпэўненае маўленне."
VoiceStudio.Gate.Attack="Атака (адкрыццё)"
VoiceStudio.Gate.Attack.Tip="Як хутка гейт адкрываецца, калі вы пачалі гаварыць."
VoiceStudio.Gate.Hold="Утрыманне"
VoiceStudio.Gate.Hold.Tip="Колькі гейт застаецца адкрытым пасля заканчэння фразы — каб не абразаць канчаткі слоў."
VoiceStudio.Gate.Release="Аднаўленне (закрыццё)"
VoiceStudio.Gate.Release.Tip="Як плаўна гейт закрываецца пасля фразы."

VoiceStudio.Eq="🎚 Эквалайзер (тэмбр голасу)"
VoiceStudio.Eq.Tip="Змяняе афарбоўку голасу: больш або менш нізоў, разборлівасці, «паветра». «Разумная налада» падладжвае яго пад ваш мікрафон."
VoiceStudio.Hpf="Прыбраць нізкі гул і стукі"
VoiceStudio.Hpf.Tip="Зразае самыя нізкія частоты: гул, стук па стале, вібрацыю стойкі, «бубненне» ад дыхання ў мікрафон. Амаль заўсёды варта пакідаць уключаным."
VoiceStudio.Hpf.Freq="Зрэзаць ніжэй"
VoiceStudio.Hpf.Freq.Tip="80 Гц — для большасці галасоў. 100–120 Гц — калі шмат гулу. Для нізкіх мужчынскіх галасоў не падымайце вышэй за 90 Гц."
VoiceStudio.Hpf.Slope="Крутасць зрэзу"
VoiceStudio.Hpf.Slope12="12 дБ/акт — мякка"
VoiceStudio.Hpf.Slope24="24 дБ/акт — рэзка"
VoiceStudio.Eq.Low="Глыбіня (бас)"
VoiceStudio.Eq.Low.Tip="Плюс — голас больш салідны і «аксамітны». Мінус — калі голас бубніць або мікрафон занадта блізка."
VoiceStudio.Eq.LowFreq="Частата «Глыбіні»"
VoiceStudio.Eq.Mud="Гулкасць (бубненне)"
VoiceStudio.Eq.Mud.Tip="Мінус прыбірае «кардонны», «бочкавы» прызвук пакоя — голас становіцца чысцейшы. Звычайна ставяць ад −2 да −4."
VoiceStudio.Eq.MudFreq="Частата «Гулкасці»"
VoiceStudio.Eq.MudQ="Шырыня «Гулкасці»"
VoiceStudio.Eq.Q.Tip="Шырыня паласы (дабротнасць): менш — шырэй і мякчэй, больш — вузка і кропкава."
VoiceStudio.Eq.Nasal="Гугнявасць"
VoiceStudio.Eq.Nasal.Tip="Мінус прыбірае «насавое», «тэлефоннае» адценне. Плюс робіць голас шчыльнейшым у сярэдзіне."
VoiceStudio.Eq.NasalFreq="Частата «Гугнявасці»"
VoiceStudio.Eq.NasalQ="Шырыня «Гугнявасці»"
VoiceStudio.Eq.Pres="Выразнасць (разборлівасць)"
VoiceStudio.Eq.Pres.Tip="Плюс — словы гучаць выразней і «бліжэй», голас не тоне ў музыцы і гульні. Калі гук становіцца рэзкім — паменшыце."
VoiceStudio.Eq.PresFreq="Частата «Выразнасці»"
VoiceStudio.Eq.PresQ="Шырыня «Выразнасці»"
VoiceStudio.Eq.Air="Паветра (бляск)"
VoiceStudio.Eq.Air.Tip="Плюс дадае свежасці і «дарагога» студыйнага бляску. Калі стала чуваць шыпенне — паменшыце."
VoiceStudio.Eq.AirFreq="Частата «Паветра»"
VoiceStudio.Eq.Lpf="Зрэзаць вышэй"
VoiceStudio.Eq.Lpf.Tip="Прыбірае самыя высокія частоты. 20000 Гц — выключана. 3400 Гц — эфект тэлефона."

VoiceStudio.Deess="🐍 Прыбраць рэзкія шыпячыя (с, ш, ч)"
VoiceStudio.Deess.Tip="Дэ-эсер прыглушае толькі рэзкія свісцячыя і шыпячыя гукі, не закранаючы астатні голас."
VoiceStudio.Deess.Amount="Сіла"
VoiceStudio.Deess.Amount.Tip="Больш — мацней змякчае «с» і «ш». Калі голас пачаў шапялявіць — паменшыце."
VoiceStudio.Deess.Freq="Частата шыпячых"
VoiceStudio.Deess.Freq.Tip="З якой частаты лічацца шыпячыя. Звычайна 5000–7000 Гц: у жаночых галасоў вышэй, у мужчынскіх ніжэй."

VoiceStudio.Comp="🗜 Выраўноўванне гучнасці (кампрэсар)"
VoiceStudio.Comp.Tip="Робіць ціхія і гучныя словы бліжэйшымі па гучнасці: голас гучыць роўна, шчыльна і «як на радыё», гледачу не трэба круціць гучнасць."
VoiceStudio.Comp.Amount="Сіла"
VoiceStudio.Comp.Amount.Tip="30–40% — натуральна. 50–70% — шчыльна, як на радыё. Вышэй — моцны эфект. Агульная гучнасць падладжваецца аўтаматычна."
VoiceStudio.Comp.Attack="Атака"
VoiceStudio.Comp.Attack.Tip="Як хутка кампрэсар рэагуе на гучны гук. Менш — жорсткі кантроль, больш — жывейшыя пачаткі слоў."
VoiceStudio.Comp.Release="Аднаўленне"
VoiceStudio.Comp.Release.Tip="Як хутка кампрэсар «адпускае» пасля гучнага гуку."

VoiceStudio.Warmth="🔥 Цяпло (лямпавая афарбоўка)"
VoiceStudio.Warmth.Tip="Дадае мяккія гармонікі, як у лямпавага студыйнага абсталявання: голас становіцца шчыльнейшым і аксамітнейшым."
VoiceStudio.Warmth.Amount="Сіла"
VoiceStudio.Warmth.Amount.Tip="20–40% — лёгкае цяпло. Больш — прыкметная «вінтажная» хрыпата."

VoiceStudio.Voice="🎭 Змена голасу"
VoiceStudio.Voice.Tip="Змяняе вышыню і «памер» голасу. Захаванне фармант пакідае голас натуральным — без эфекту бурундука."
VoiceStudio.Voice.Pitch="Вышыня голасу"
VoiceStudio.Voice.Pitch.Tip="У паўтонах: −2 — крыху ніжэй, −12 — на актаву ніжэй, +12 — на актаву вышэй. Для натуральнага гучання трымайцеся ў межах ±3."
VoiceStudio.Voice.Formant="Тэмбр («памер» голасу)"
VoiceStudio.Voice.Formant.Tip="Змяняе афарбоўку, не змяняючы вышыню: мінус — голас «большы», дарослейшы і мужнейшы, плюс — «меншы», маладзейшы."
VoiceStudio.Voice.Preserve="Захоўваць натуральнасць (фарманты)"
VoiceStudio.Voice.Preserve.Tip="Уключана — пры змене вышыні тэмбр застаецца вашым. Выключана — класічны эфект: уверх — бурундук, уніз — запаволеная стужка."
VoiceStudio.Voice.Quality="Якасць"
VoiceStudio.Voice.Quality.High="Высокая (затрымка ~43 мс)"
VoiceStudio.Voice.Quality.Fast="Хуткая (затрымка ~21 мс)"
VoiceStudio.Voice.Quality.Tip="Высокая лепш гучыць на нізкіх галасах. Хуткая дае меншую затрымку пры праслухоўванні сябе."
VoiceStudio.Voice.Note="ℹ Змена голасу дадае невялікую затрымку гуку. Калі на запісе губы крыху не супадаюць з гукам, задайце ў OBS «Пашыраныя ўласцівасці аўдыя → Зрух сінхранізацыі» для відэа або мікрафона."

VoiceStudio.OutputGain="Выніковая гучнасць"
VoiceStudio.OutputGain.Tip="Гучнасць голасу на выхадзе плагіна. Сачыце за індыкатарам у мікшары OBS: маўленне павінна даходзіць да жоўтай зоны, але не да чырвонай."
VoiceStudio.Limiter="🛡 Абарона ад перагрузу (ліміцер)"
VoiceStudio.Limiter.Tip="Не дае голасу «захрыпець» на крыку, смеху або кашлі. Лепш заўсёды трымаць уключаным."
VoiceStudio.Limiter.Ceiling="Столь гучнасці"
VoiceStudio.Limiter.Ceiling.Tip="Максімальны ўзровень на выхадзе. −1 дБ — стандартны бяспечны запас."

VoiceStudio.Live.In="Уваход"
VoiceStudio.Live.Out="Выхад"
VoiceStudio.Live.Voice="ШІ чуе голас"
VoiceStudio.Live.Silence="Цішыня"
VoiceStudio.Live.NoSignal="Няма гуку з мікрафона"
VoiceStudio.Live.Off="Фільтр выключаны"
VoiceStudio.Live.Squeeze="сцісканне %1 дБ"
VoiceStudio.Live.GatePause="паўза прыглушана"
VoiceStudio.Live.EqHint="Эквалайзер: цягніце кропкі мышшу — улева-ўправа частата, уверх-уніз гучнасць, кола мышы над кропкай — шырыня, падвойная пстрычка — скід. Шэрым паказаны спектр вашага голасу."
VoiceStudio.Live.EqOff="Эквалайзер выключаны — уключыце яго ў раздзеле «Эквалайзер» ніжэй"
VoiceStudio.Live.Hpf="Зрэз гулу"
VoiceStudio.Live.Low="Глыбіня"
VoiceStudio.Live.Mud="Гулкасць"
VoiceStudio.Live.Nasal="Гугнявасць"
