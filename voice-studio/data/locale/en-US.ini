VoiceStudio.FilterName="🎙 Voice Studio"
VoiceStudio.Description="Studio voice processing for recording and streaming: AI noise suppression, smart auto-setup, EQ, compressor, de-esser and voice changer."

VoiceStudio.Unit.dB=" dB"
VoiceStudio.Unit.Hz=" Hz"
VoiceStudio.Unit.ms=" ms"
VoiceStudio.Unit.Percent=" %"
VoiceStudio.Unit.Semitones=" st"

VoiceStudio.Mode="Settings mode"
VoiceStudio.Mode.Simple="🙂 Simple — just the essentials"
VoiceStudio.Mode.Expert="🛠 Expert — all parameters"
VoiceStudio.Mode.Tip="Simple mode shows only easy-to-understand sliders. Expert adds frequencies, Q, attack and release times. Switching modes does not change the sound."

VoiceStudio.Guide="How to use — 3 steps:\n1. Pick a sound style.\n2. Press «✨ Smart setup» and talk normally for 10 seconds, with pauses.\n3. Press «🎧 Listen to myself», put on headphones and adjust the sliders to taste.\nHover the help icon next to a control to see what it does."

VoiceStudio.Preset="Sound style"
VoiceStudio.Preset.Tip="Ready-made settings for different tasks. Picking a style sets the sliders below. Microphone gain and gate threshold are kept — Smart setup picks them."
VoiceStudio.Preset.Natural="🌿 Natural and clean"
VoiceStudio.Preset.Natural.Tip="A clean natural voice without effects: removes noise, hum and harsh sibilance, adds a bit of clarity. Good for almost everything."
VoiceStudio.Preset.Podcast="🎙 Podcast / radio host"
VoiceStudio.Preset.Podcast.Tip="Dense, close, expensive-sounding radio voice: more low-end velvet, even loudness, a touch of tube warmth."
VoiceStudio.Preset.Stream="🎮 Streaming and gaming"
VoiceStudio.Preset.Stream.Tip="Maximum clarity and zero noise: your voice cuts through game audio, keyboard and fans are gone."
VoiceStudio.Preset.Deep="🌙 Deep and velvety"
VoiceStudio.Preset.Deep.Tip="Sounds deeper and more solid through tone shaping (pitch unchanged): more lows, warmer, softer."
VoiceStudio.Preset.Bright="✨ Bright and crisp"
VoiceStudio.Preset.Bright.Tip="Fresh airy voice with sparkle — great for dull microphones and dark voices."
VoiceStudio.Preset.Noisy="🏠 Noisy room"
VoiceStudio.Preset.Noisy.Tip="For noisy places: fans, street, mechanical keyboard. Strongest noise suppression and a strict gate."
VoiceStudio.Preset.Minimal="🧹 Only remove noise"
VoiceStudio.Preset.Minimal.Tip="Your voice stays as is — the neural network only removes noise and low rumble."
VoiceStudio.Preset.Phone="📞 Effect: phone / radio"
VoiceStudio.Preset.Phone.Tip="Narrow telephone sound with a little grit — for skits and videos."
VoiceStudio.Preset.Monster="👹 Effect: monster"
VoiceStudio.Preset.Monster.Tip="Huge low voice: pitch −5 and a bigger voice size. For jokes and characters."
VoiceStudio.Preset.Cartoon="🐿 Effect: cartoon"
VoiceStudio.Preset.Cartoon.Tip="High cheerful cartoon character voice."
VoiceStudio.Preset.Custom="🛠 Custom"
VoiceStudio.Preset.Custom.Tip="Sliders are left unchanged — tune everything yourself."

VoiceStudio.Calib.Start="✨ Smart setup for my voice (10 s)"
VoiceStudio.Calib.Stop="⏹ Stop analysis"
VoiceStudio.Calib.Tip="The plugin listens to your microphone for 10 seconds. A neural network separates speech from pauses, measures voice level, room noise, sibilance and tone, then tunes gain, noise suppression, gate, compressor, de-esser and EQ. You can run it again — corrections do not stack."
VoiceStudio.Calib.Hint="Press the button above and talk normally with short pauses — for example, describe what you are going to record."
VoiceStudio.Calib.Listening="🎙 Listening… Talk normally and pause between phrases. %d s left.\n(If the countdown does not move, make sure the filter is enabled and the microphone works.)"
VoiceStudio.Calib.Cancelled="Analysis stopped. Settings were not changed."
VoiceStudio.Calib.NoVoice="⚠ Could not hear a voice. Check that the source uses the right microphone, it is not muted in Windows, and talk during the analysis. Then run the setup again."
VoiceStudio.Calib.Done="✅ Done! Voice: %.0f dB, room noise: %.0f dB (margin %.0f dB). Microphone gain: %+.1f dB.\nSliders are tuned for your voice — turn on listening and check it out."
VoiceStudio.Calib.TooQuiet="⚠ The microphone is very quiet. Raise its level in Windows (Settings → Sound → Input → Volume) or on your audio interface and run the setup again."
VoiceStudio.Calib.Clipping="⚠ The microphone is overloaded (distorts on loud words). Lower its level in Windows or on your audio interface and run the setup again."
VoiceStudio.Calib.Noisy="ℹ The room is rather noisy — noise suppression is set to maximum. Try the «🏠 Noisy room» style."
VoiceStudio.Calib.QuietRoom="👍 Your room is nice and quiet."

VoiceStudio.Monitor.On="🎧 Listen to myself (turn on monitoring)"
VoiceStudio.Monitor.Off="🔇 Turn off monitoring"
VoiceStudio.Monitor.Tip="Sets this microphone to «Monitoring Enabled» in OBS: you hear yourself already processed and immediately understand how to move the sliders. Use headphones!"
VoiceStudio.Monitor.Info="Monitoring audio goes to: %s. Wear headphones — otherwise the microphone hears your speakers and you get echo or feedback. Change the device in «Settings → Audio → Advanced». A small delay while monitoring is normal, recordings are not affected."
VoiceStudio.Monitor.DefaultDevice="default device"

VoiceStudio.Bypass="🔁 Compare with original (temporarily bypass processing)"
VoiceStudio.Bypass.Tip="Tick to hear your voice without processing, untick to bring it back. An easy way to tell whether it got better."

VoiceStudio.InputGain="Microphone gain"
VoiceStudio.InputGain.Tip="How much to boost the microphone before processing. Smart setup sets it for you. Too quiet — raise it, distorted — lower it."

VoiceStudio.Denoise="🤖 AI noise suppression (RNNoise 0.2 neural network)"
VoiceStudio.Denoise.Tip="A neural network tells voice from noise and removes fans, PC hum, street, keyboard and room echo."
VoiceStudio.Denoise.Amount="Strength"
VoiceStudio.Denoise.Amount.Tip="100% removes noise completely. If the voice sounds hollow or loses word endings, lower it to 70–85% to keep a bit of natural background."

VoiceStudio.Gate="🚪 Noise gate (silence between phrases)"
VoiceStudio.Gate.Tip="Turns the sound down while you are silent: breathing, mouse clicks, room sounds between phrases."
VoiceStudio.Gate.Mode="How to detect that you are talking"
VoiceStudio.Gate.Mode.Voice="🤖 By voice (AI) — recommended"
VoiceStudio.Gate.Mode.Level="📶 By loudness (classic)"
VoiceStudio.Gate.Mode.Both="🤖+📶 Voice and loudness (noisy rooms)"
VoiceStudio.Gate.Mode.Tip="By voice — the neural network hears actual speech and ignores key clicks. By loudness — anything above the threshold. Voice and loudness — both at once, the strictest."
VoiceStudio.Gate.Threshold="Silence threshold"
VoiceStudio.Gate.Threshold.Tip="Anything quieter than this is a pause. If quiet words get cut, move it left. If you hear noise between phrases, move it right. Smart setup picks it."
VoiceStudio.Gate.Range="How much to quiet pauses"
VoiceStudio.Gate.Range.Tip="−20 dB — pauses noticeably quieter but natural. −60 dB — full silence. 0 — the gate does nothing."
VoiceStudio.Gate.VadSens="Voice sensitivity"
VoiceStudio.Gate.VadSens.Tip="Higher opens even on a whisper, lower only on confident speech."
VoiceStudio.Gate.Attack="Attack (opening)"
VoiceStudio.Gate.Attack.Tip="How fast the gate opens when you start talking."
VoiceStudio.Gate.Hold="Hold"
VoiceStudio.Gate.Hold.Tip="How long the gate stays open after a phrase so word endings are not cut."
VoiceStudio.Gate.Release="Release (closing)"
VoiceStudio.Gate.Release.Tip="How smoothly the gate closes after a phrase."

VoiceStudio.Eq="🎚 Equalizer (voice tone)"
VoiceStudio.Eq.Tip="Shapes the color of your voice: more or less lows, clarity and air. Smart setup adapts it to your microphone."
VoiceStudio.Hpf="Remove low rumble and thumps"
VoiceStudio.Hpf.Tip="Cuts the lowest frequencies: hum, desk thumps, stand vibration, breath pops. Almost always worth keeping on."
VoiceStudio.Hpf.Freq="Cut below"
VoiceStudio.Hpf.Freq.Tip="80 Hz for most voices. 100–120 Hz if there is a lot of rumble. For deep male voices keep it under 90 Hz."
VoiceStudio.Hpf.Slope="Cut slope"
VoiceStudio.Hpf.Slope12="12 dB/oct — gentle"
VoiceStudio.Hpf.Slope24="24 dB/oct — steep"
VoiceStudio.Eq.Low="Depth (bass)"
VoiceStudio.Eq.Low.Tip="Plus — a more solid, velvety voice. Minus — if the voice booms or the mic is too close."
VoiceStudio.Eq.LowFreq="Depth frequency"
VoiceStudio.Eq.Mud="Boominess (mud)"
VoiceStudio.Eq.Mud.Tip="Minus removes the boxy, cardboard room sound — the voice gets cleaner. Usually −2 to −4."
VoiceStudio.Eq.MudFreq="Boominess frequency"
VoiceStudio.Eq.MudQ="Boominess width"
VoiceStudio.Eq.Q.Tip="Bandwidth (Q): lower is wider and softer, higher is narrow and precise."
VoiceStudio.Eq.Nasal="Nasality"
VoiceStudio.Eq.Nasal.Tip="Minus removes a nasal, telephone-like tint. Plus makes the midrange denser."
VoiceStudio.Eq.NasalFreq="Nasality frequency"
VoiceStudio.Eq.NasalQ="Nasality width"
VoiceStudio.Eq.Pres="Clarity (presence)"
VoiceStudio.Eq.Pres.Tip="Plus — words sound clearer and closer, the voice does not drown in music or game audio. If it gets harsh, lower it."
VoiceStudio.Eq.PresFreq="Clarity frequency"
VoiceStudio.Eq.PresQ="Clarity width"
VoiceStudio.Eq.Air="Air (sparkle)"
VoiceStudio.Eq.Air.Tip="Plus adds freshness and expensive studio sparkle. If hiss becomes audible, lower it."
VoiceStudio.Eq.AirFreq="Air frequency"
VoiceStudio.Eq.Lpf="Cut above"
VoiceStudio.Eq.Lpf.Tip="Removes the highest frequencies. 20000 Hz — off. 3400 Hz — telephone effect."

VoiceStudio.Deess="🐍 Tame harsh sibilance (s, sh)"
VoiceStudio.Deess.Tip="The de-esser softens only harsh hissing sounds and leaves the rest of the voice alone."
VoiceStudio.Deess.Amount="Strength"
VoiceStudio.Deess.Amount.Tip="Higher softens s and sh more. If you start sounding lispy, lower it."
VoiceStudio.Deess.Freq="Sibilance frequency"
VoiceStudio.Deess.Freq.Tip="Where sibilance starts. Usually 5000–7000 Hz: higher for female voices, lower for male."

VoiceStudio.Comp="🗜 Level evening (compressor)"
VoiceStudio.Comp.Tip="Brings quiet and loud words closer together: the voice sounds even, dense and radio-like, viewers do not need to ride the volume."
VoiceStudio.Comp.Amount="Strength"
VoiceStudio.Comp.Amount.Tip="30–40% — natural. 50–70% — dense radio sound. Higher — strong effect. Overall loudness is compensated automatically."
VoiceStudio.Comp.Attack="Attack"
VoiceStudio.Comp.Attack.Tip="How fast the compressor reacts to loud sounds. Lower is tighter, higher keeps word onsets lively."
VoiceStudio.Comp.Release="Release"
VoiceStudio.Comp.Release.Tip="How fast the compressor lets go after a loud sound."

VoiceStudio.Warmth="🔥 Warmth (tube color)"
VoiceStudio.Warmth.Tip="Adds soft harmonics like tube studio gear: the voice gets denser and more velvety."
VoiceStudio.Warmth.Amount="Strength"
VoiceStudio.Warmth.Amount.Tip="20–40% — gentle warmth. More — audible vintage grit."

VoiceStudio.Voice="🎭 Voice changer"
VoiceStudio.Voice.Tip="Changes pitch and voice size. Formant preservation keeps the voice natural — no chipmunk effect."
VoiceStudio.Voice.Pitch="Pitch"
VoiceStudio.Voice.Pitch.Tip="In semitones: −2 slightly lower, −12 one octave lower, +12 one octave higher. Stay within ±3 for a natural sound."
VoiceStudio.Voice.Formant="Timbre (voice size)"
VoiceStudio.Voice.Formant.Tip="Changes color without changing pitch: minus — a bigger, older, more masculine voice; plus — smaller and younger."
VoiceStudio.Voice.Preserve="Keep it natural (preserve formants)"
VoiceStudio.Voice.Preserve.Tip="On — your timbre stays yours when pitch changes. Off — the classic effect: up is a chipmunk, down is slowed-down tape."
VoiceStudio.Voice.Quality="Quality"
VoiceStudio.Voice.Quality.High="High (≈43 ms delay)"
VoiceStudio.Voice.Quality.Fast="Fast (≈21 ms delay)"
VoiceStudio.Voice.Quality.Tip="High sounds better on low voices. Fast has less delay while monitoring yourself."
VoiceStudio.Voice.Note="ℹ The voice changer adds a small audio delay. If lips and sound drift slightly in recordings, use OBS «Advanced Audio Properties → Sync Offset»."

VoiceStudio.OutputGain="Output volume"
VoiceStudio.OutputGain.Tip="Voice level at the plugin output. Watch the OBS mixer meter: speech should reach the yellow zone but not the red one."
VoiceStudio.Limiter="🛡 Overload protection (limiter)"
VoiceStudio.Limiter.Tip="Keeps the voice from distorting on shouts, laughter or coughs. Best kept on."
VoiceStudio.Limiter.Ceiling="Loudness ceiling"
VoiceStudio.Limiter.Ceiling.Tip="Maximum output level. −1 dB is the standard safe margin."

VoiceStudio.Live.In="Input"
VoiceStudio.Live.Out="Output"
VoiceStudio.Live.Voice="AI hears your voice"
VoiceStudio.Live.Silence="Silence"
VoiceStudio.Live.NoSignal="No sound from the microphone"
VoiceStudio.Live.Off="Filter is disabled"
VoiceStudio.Live.Squeeze="squeeze %1 dB"
VoiceStudio.Live.GatePause="pause softened"
VoiceStudio.Live.EqHint="Equalizer: drag the dots — left-right is frequency, up-down is loudness, wheel over a dot is width, double-click resets. The gray area is your voice spectrum."
VoiceStudio.Live.EqOff="Equalizer is off — turn it on in the Equalizer section below"
VoiceStudio.Live.Hpf="Rumble cut"
VoiceStudio.Live.Low="Depth"
VoiceStudio.Live.Mud="Boominess"
VoiceStudio.Live.Nasal="Nasality"
VoiceStudio.Live.Pres="Clarity"
VoiceStudio.Live.Air="Air"
VoiceStudio.Live.kHz=" kHz"

