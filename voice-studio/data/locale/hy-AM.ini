VoiceStudio.FilterName="🎙 Ձայնային ստուդիա"
VoiceStudio.Description="Ձայնի ստուդիական մշակում ձայնագրության և սթրիմների համար՝ աղմուկի ճնշում ԱԲ-ով, խելացի ավտոկարգավորում, էկվալայզեր, կոմպրեսոր, դե-էսսեր, ձայնի փոփոխում։"

VoiceStudio.Unit.dB=" դԲ"
VoiceStudio.Unit.Hz=" Հց"
VoiceStudio.Unit.ms=" մվ"
VoiceStudio.Unit.Percent=" %"
VoiceStudio.Unit.Semitones=" կտ"

VoiceStudio.Mode="Կարգավորումների ռեժիմ"
VoiceStudio.Mode.Simple="🙂 Պարզ — միայն գլխավորը"
VoiceStudio.Mode.Expert="🛠 Փորձագետ — բոլոր պարամետրերը"
VoiceStudio.Mode.Tip="Պարզ ռեժիմը ցույց է տալիս միայն հասկանալի սահիչները։ Փորձագետի ռեժիմն ավելացնում է հաճախականությունները, բարորակությունը (Q), ատակի և վերականգնման ժամանակը։ Ռեժիմը փոխելիս ձայնը չի փոխվում։"

VoiceStudio.Guide="Ինչպես օգտվել — 3 քայլ\n1. Ընտրեք պատրաստի հնչողության ոճ։\n2. Սեղմեք «✨ Խելացի կարգավորում» և 10 վայրկյան խոսեք սովորական ձայնով, դադարներով։\n3. Սեղմեք «🎧 Լսել ինքս ինձ», դրեք ականջակալները և շարժեք սահիչները ըստ ձեր ճաշակի։\nՄկնիկը պահեք անվան կողքի հուշման պատկերակի վրա — այնտեղ բացատրված է, թե ինչ է անում յուրաքանչյուր սահիչ։"

VoiceStudio.Preset="Հնչողության ոճ"
VoiceStudio.Preset.Tip="Պատրաստի կարգավորումներ տարբեր նպատակների համար։ Ոճ ընտրելիս ներքևի սահիչներն ինքնաբերաբար կդրվեն։ Միկրոֆոնի ուժգնությունը և գեյթի շեմը չեն փոխվում — դրանք ընտրում է «Խելացի կարգավորում» գործառույթը։"
VoiceStudio.Preset.Natural="🌿 Բնական և մաքուր"
VoiceStudio.Preset.Natural.Tip="Մաքուր, բնական ձայն առանց «էֆեկտների»՝ հեռացնում է աղմուկը, բզզոցը և սուլող հնչյունները, մի փոքր ավելացնում է հստակությունը։ Լավ է գրեթե ամեն ինչի համար։"
VoiceStudio.Preset.Podcast="🎙 Փոդքաստ / ռադիոհաղորդավար"
VoiceStudio.Preset.Podcast.Tip="Խիտ, մոտ, «թանկ» ձայն, ինչպես ռադիոյում՝ ավելի թավշյա ցածրեր, հավասար ուժգնություն, թեթև լամպային ջերմություն։"
VoiceStudio.Preset.Stream="🎮 Սթրիմ և խաղեր"
VoiceStudio.Preset.Stream.Tip="Առավելագույն հստակություն և ոչ մի աղմուկ՝ ձայնը լսելի է խաղի ձայնի միջով, ստեղնաշարն ու օդափոխիչը չեն լսվում։"
VoiceStudio.Preset.Deep="🌙 Խորը թավշյա"
VoiceStudio.Preset.Deep.Tip="Ձայնը տեմբրի շնորհիվ հնչում է ավելի ցածր և ամուր (բարձրությունը չի փոխվում)՝ ավելի շատ ցածրեր, ավելի ջերմ ու փափուկ։"
VoiceStudio.Preset.Bright="✨ Պայծառ և զնգուն"
VoiceStudio.Preset.Bright.Tip="Թարմ, «օդային» ձայն փայլով — լավ է խուլ միկրոֆոնների և մութ ձայների համար։"
VoiceStudio.Preset.Noisy="🏠 Աղմկոտ սենյակ"
VoiceStudio.Preset.Noisy.Tip="Աղմկոտ տարածքի համար՝ օդափոխիչ, փողոց, մեխանիկական ստեղնաշար։ Ամենաուժեղ աղմուկի ճնշումը և խիստ գեյթ։"
VoiceStudio.Preset.Minimal="🧹 Միայն հեռացնել աղմուկը"
VoiceStudio.Preset.Minimal.Tip="Ձայնը չի փոխվում — նեյրոցանցը միայն հեռացնում է աղմուկը և ցածր բզզոցը։ Նրանց համար, ում դուր է գալիս իրենց միկրոֆոնը հենց այնպես, ինչպես կա։"
VoiceStudio.Preset.Phone="📞 Էֆեկտ՝ հեռախոս / ռացիա"
VoiceStudio.Preset.Phone.Tip="Նեղ «հեռախոսային» ձայն՝ թեթև խռպոտությամբ — տեսարանների և տեսահոլովակների համար։"
VoiceStudio.Preset.Monster="👹 Էֆեկտ՝ հրեշ"
VoiceStudio.Preset.Monster.Tip="Ցածր, հսկայական ձայն՝ բարձրությունը −5, ձայնի «չափն» ավելի մեծ։ Կատակների և կերպարների համար։"
VoiceStudio.Preset.Cartoon="🐿 Էֆեկտ՝ մուլտհերոս"
VoiceStudio.Preset.Cartoon.Tip="Մուլտֆիլմի հերոսի բարձր, ուրախ ձայն։"
VoiceStudio.Preset.Custom="🛠 Իմ կարգավորումը"
VoiceStudio.Preset.Custom.Tip="Սահիչները չեն փոխվում — կարգավորեք ամեն ինչ ինքներդ։"

VoiceStudio.Calib.Start="✨ Խելացի կարգավորում իմ ձայնի համար (10 վրկ)"
VoiceStudio.Calib.Stop="⏹ Դադարեցնել վերլուծությունը"
VoiceStudio.Calib.Tip="Պլագինը 10 վայրկյան կլսի միկրոֆոնը։ Նեյրոցանցն ինքը կտարբերի խոսքը դադարներից, կչափի ձայնի ուժգնությունը, սենյակի աղմուկը, սուլող հնչյունները և տեմբրը, ապա կկարգավորի ուժեղացումը, աղմուկի ճնշումը, գեյթը, կոմպրեսորը, դե-էսսերը և էկվալայզերը։ Կարող եք կրկին գործարկել — ուղղումները չեն կուտակվում։"
VoiceStudio.Calib.Hint="Սեղմեք վերևի կոճակը և խոսեք սովորական ձայնով՝ փոքր դադարներով։ Օրինակ՝ պատմեք, թե ինչ եք պատրաստվում ձայնագրել։"
VoiceStudio.Calib.Listening="🎙 Լսում եմ… Խոսեք սովորական ձայնով, դադարներ արեք արտահայտությունների միջև։ Մնաց %d վրկ։\n(Եթե հետհաշվարկը տեղից չի շարժվում, ստուգեք, որ ֆիլտրը միացված է, և միկրոֆոնն աշխատում է։)"
VoiceStudio.Calib.Cancelled="Վերլուծությունը դադարեցվեց։ Կարգավորումները չեն փոխվել։"
VoiceStudio.Calib.NoVoice="⚠ Չհաջողվեց լսել ձայնը։ Ստուգեք, որ աղբյուրում ընտրված է ճիշտ միկրոֆոնը, և այն անջատված չէ Windows-ում։ Վերլուծության ընթացքում խոսեք, ապա նորից գործարկեք կարգավորումը։"
VoiceStudio.Calib.Done="✅ Պատրաստ է։ Ձայն՝ %.0f դԲ, սենյակի աղմուկ՝ %.0f դԲ (պաշար՝ %.0f դԲ)։ Միկրոֆոնի ուժեղացում՝ %+.1f դԲ։\nՍահիչները հարմարեցված են ձեր ձայնին — միացրեք լսումը և գնահատեք։"
VoiceStudio.Calib.TooQuiet="⚠ Միկրոֆոնը շատ թույլ է հնչում։ Բարձրացրեք դրա մակարդակը Windows-ում (Կարգավորումներ → Ձայն → Մուտք → Ձայնի ուժգնություն) կամ ձայնային քարտում և կրկնեք կարգավորումը։"
VoiceStudio.Calib.Clipping="⚠ Միկրոֆոնը գերբեռնված է (խռպոտում է բարձր բառերի վրա)։ Իջեցրեք դրա մակարդակը Windows-ում կամ ձայնային քարտում և կրկնեք կարգավորումը։"
VoiceStudio.Calib.Noisy="ℹ Սենյակում բավական աղմկոտ է — աղմուկի ճնշումը միացված է ամբողջ ուժով։ Փորձեք «🏠 Աղմկոտ սենյակ» ոճը։"
VoiceStudio.Calib.QuietRoom="👍 Սենյակում հիանալի լռություն է։"

VoiceStudio.Monitor.On="🎧 Լսել ինքս ինձ (միացնել լսումը)"
VoiceStudio.Monitor.Off="🔇 Անջատել լսումը"
VoiceStudio.Monitor.Tip="Միացնում է OBS-ի «Մոնիտորինգ և ելք» ռեժիմն այս միկրոֆոնի համար՝ դուք լսում եք ձեզ արդեն մշակված ձայնով և անմիջապես հասկանում, թե ինչպես շարժել սահիչները։ Պարտադիր՝ ականջակալներով։"
VoiceStudio.Monitor.Info="Լսման ձայնը գնում է՝ %s։ Դրեք ականջակալները, այլապես միկրոֆոնը կլսի բարձրախոսները, և կառաջանա արձագանք կամ սուլոց։ Սարքը փոխվում է «Կարգավորումներ → Աուդիո → Ընդլայնված» բաժնում։ Լսելիս փոքր ուշացումը նորմալ է, ձայնագրության մեջ այն չկա։"
VoiceStudio.Monitor.DefaultDevice="լռելյայն սարք"

VoiceStudio.Bypass="🔁 Համեմատել բնօրինակի հետ (ժամանակավորապես անջատել մշակումը)"
VoiceStudio.Bypass.Tip="Նշեք վանդակը՝ ձայնն առանց մշակման լսելու համար, հանեք նշումը՝ վերադարձնելու համար։ Այսպես հեշտ է հասկանալ՝ ավելի լավ է դարձել, թե ոչ։"

VoiceStudio.InputGain="Միկրոֆոնի ուժգնություն"
VoiceStudio.InputGain.Tip="Որքան ուժեղացնել միկրոֆոնի ազդանշանը մինչև մշակումը։ «Խելացի կարգավորում» գործառույթն այն ինքն է սահմանում։ Եթե ձայնը թույլ է՝ ավելացրեք, եթե խռպոտում է՝ նվազեցրեք։"

VoiceStudio.Denoise="🤖 Աղմուկի ճնշում ԱԲ-ով (RNNoise 0.2 նեյրոցանց)"
VoiceStudio.Denoise.Tip="Նեյրոցանցը տարբերում է ձայնը աղմուկից և հեռացնում օդափոխիչը, համակարգչի բզզոցը, փողոցը, ստեղնաշարը, սենյակի արձագանքը։"
VoiceStudio.Denoise.Amount="Ուժ"
VoiceStudio.Denoise.Amount.Tip="100% — աղմուկն ամբողջությամբ հեռացնել։ Եթե ձայնը հնչում է «ինչպես խողովակի մեջ» կամ «կուլ է տալիս» բառերի վերջավորությունները, նվազեցրեք մինչև 70–85% — բնական ֆոնը մի փոքր կմնա։"

VoiceStudio.Gate="🚪 Աղմուկի գեյթ (լռություն դադարներում)"
VoiceStudio.Gate.Tip="Խլացնում է ձայնը, երբ լռում եք՝ շնչառությունը, մկնիկի չխկոցները, սենյակի ձայները արտահայտությունների միջև։"
VoiceStudio.Gate.Mode="Ինչպես հասկանալ, որ խոսում եք"
VoiceStudio.Gate.Mode.Voice="🤖 Ըստ ձայնի (ԱԲ) — խորհուրդ է տրվում"
VoiceStudio.Gate.Mode.Level="📶 Ըստ ուժգնության (դասական)"
VoiceStudio.Gate.Mode.Both="🤖+📶 Ձայն և ուժգնություն (աղմկոտ սենյակների համար)"
VoiceStudio.Gate.Mode.Tip="«Ըստ ձայնի»՝ նեյրոցանցը լսում է հենց խոսքը և չի բացում գեյթը ստեղների չխկոցից։ «Ըստ ուժգնության»՝ ամեն ինչ, ինչը շեմից բարձր է։ «Ձայն և ուժգնություն»՝ երկու պայմանը միասին, ամենախիստը։"
