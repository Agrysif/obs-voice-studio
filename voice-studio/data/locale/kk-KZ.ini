VoiceStudio.Mode.Expert="🛠 Сарапшы — барлық параметрлер"
VoiceStudio.Mode.Tip="Қарапайым режим тек түсінікті жүгірткілерді көрсетеді. Сарапшы режимі жиіліктерді, сапалылықты (Q), шабуыл мен қалпына келу уақытын қосады. Режимді ауыстырғанда дыбыс өзгермейді."

VoiceStudio.Guide="Қалай қолдану керек — 3 қадам:\n1. Дайын дыбыс стилін таңдаңыз.\n2. «✨ Ақылды баптау» батырмасын басып, 10 секунд әдеттегі дауыспен, үзіліс жасап сөйлеңіз.\n3. «🎧 Өзімді тыңдау» батырмасын басып, құлаққап киіп, жүгірткілерді өз қалауыңызша жылжытыңыз.\nАтаудың жанындағы кеңес белгішесіне тінтуірді апарыңыз — онда әр жүгірткі не істейтіні түсіндірілген."

VoiceStudio.Preset="Дыбыс стилі"
VoiceStudio.Preset.Tip="Әртүрлі міндеттерге арналған дайын баптаулар. Стильді таңдағанда төмендегі жүгірткілер өздігінен орнатылады. Микрофон дыбысы мен гейт шегі бұл кезде өзгермейді — оларды «Ақылды баптау» таңдайды."
VoiceStudio.Preset.Natural="🌿 Табиғи және таза"
VoiceStudio.Preset.Natural.Tip="«Эффектілерсіз» таза табиғи дауыс: шуды, гуілді және ысылдаған дыбыстарды кетіреді, сөзді сәл анығырақ етеді. Барлығына дерлік жарайды."
VoiceStudio.Preset.Podcast="🎙 Подкаст / радио жүргізуші"
VoiceStudio.Preset.Podcast.Tip="Радиодағыдай тығыз, жақын, «қымбат» дауыс: төменгі жиілікте барқыттылық көбірек, біркелкі дыбыс деңгейі, жеңіл лампалық жылулық."
VoiceStudio.Preset.Stream="🎮 Стрим және ойындар"
VoiceStudio.Preset.Stream.Tip="Барынша анық сөз және ешқандай шу жоқ: дауыс ойын дыбысын жарып өтеді, пернетақта мен желдеткіш естілмейді."
VoiceStudio.Preset.Deep="🌙 Терең барқыт"
VoiceStudio.Preset.Deep.Tip="Тембр есебінен дауыс төменірек және салмақтырақ естіледі (биіктігі өзгермейді): төменгі жиіліктер көбірек, жылырақ, жұмсағырақ."
VoiceStudio.Preset.Bright="✨ Жарқын және сыңғыр"
VoiceStudio.Preset.Bright.Tip="Жылтыры бар сергек, «ауалы» дауыс — тұйық микрофондар мен бәсең дауыстарға жақсы."
VoiceStudio.Preset.Noisy="🏠 Шулы бөлме"
VoiceStudio.Preset.Noisy.Tip="Шулы бөлмеге арналған: желдеткіш, көше, механикалық пернетақта. Ең күшті шуды басу және қатаң гейт."
VoiceStudio.Preset.Minimal="🧹 Тек шуды кетіру"
VoiceStudio.Preset.Minimal.Tip="Дауыс өзгермейді — нейрожелі тек шу мен төменгі гуілді кетіреді. Өз микрофонын сол күйінде ұнататындар үшін."
VoiceStudio.Preset.Phone="📞 Эффект: телефон / рация"
VoiceStudio.Preset.Phone.Tip="Сәл қырылдаған тар «телефондық» дыбыс — көріністер мен бейнелерге арналған."
VoiceStudio.Preset.Monster="👹 Эффект: құбыжық"
VoiceStudio.Preset.Monster.Tip="Төмен, алып дауыс: биіктігі −5, дауыстың «көлемі» үлкенірек. Әзіл мен кейіпкерлерге арналған."
VoiceStudio.Preset.Cartoon="🐿 Эффект: мультфильм"
VoiceStudio.Preset.Cartoon.Tip="Мультфильм кейіпкерінің жоғары, көңілді дауысы."
VoiceStudio.Preset.Custom="🛠 Өз баптауым"
VoiceStudio.Preset.Custom.Tip="Жүгірткілер өзгермейді — бәрін өзіңіз баптаңыз."

VoiceStudio.Calib.Start="✨ Ақылды баптау — дауысыма бейімдеу (10 сек)"
VoiceStudio.Calib.Stop="⏹ Талдауды тоқтату"
VoiceStudio.Calib.Tip="Плагин микрофонды 10 секунд тыңдайды. Нейрожелі сөзді үзілістерден өзі ажыратып, дауыс деңгейін, бөлме шуын, ысылдаған дыбыстар мен тембрді өлшейді, содан кейін күшейтуді, шуды басуды, гейтті, компрессорды, де-эссерді және эквалайзерді баптайды. Қайта іске қосуға болады — түзетулер жинақталмайды."
VoiceStudio.Calib.Hint="Жоғарыдағы батырманы басып, қысқа үзілістермен әдеттегі дауыспен сөйлеңіз — мысалы, не жазбақ екеніңізді айтып беріңіз."
VoiceStudio.Calib.Listening="🎙 Тыңдап жатырмын… Әдеттегі дауыспен сөйлеңіз, сөйлемдер арасында үзіліс жасаңыз. %d сек қалды.\n(Егер санау бір орында тұрса — сүзгі қосулы екенін және микрофон жұмыс істейтінін тексеріңіз.)"
VoiceStudio.Calib.Cancelled="Талдау тоқтатылды. Баптаулар өзгерген жоқ."
VoiceStudio.Calib.NoVoice="⚠ Дауысты есту мүмкін болмады. Көзде дұрыс микрофон таңдалғанын, оның Windows-та өшірілмегенін тексеріңіз және талдау кезінде сөйлеңіз. Содан кейін баптауды қайта іске қосыңыз."
VoiceStudio.Calib.Done="✅ Дайын! Дауыс: %.0f дБ, бөлме шуы: %.0f дБ (қор %.0f дБ). Микрофон күшейтуі: %+.1f дБ.\nЖүгірткілер дауысыңызға бейімделді — тыңдауды қосып, бағалаңыз."
VoiceStudio.Calib.TooQuiet="⚠ Микрофон өте ақырын естіледі. Оның деңгейін Windows-та (Параметрлер → Дыбыс → Кіріс → Дыбыс деңгейі) немесе дыбыс картасында көтеріп, баптауды қайталаңыз."
VoiceStudio.Calib.Clipping="⚠ Микрофон шамадан тыс жүктелген (қатты сөздерде қырылдайды). Оның деңгейін Windows-та немесе дыбыс картасында азайтып, баптауды қайталаңыз."
VoiceStudio.Calib.Noisy="ℹ Бөлмеде біршама шулы — шуды басу толық қуатқа қосылды. «🏠 Шулы бөлме» стилін қолданып көріңіз."
VoiceStudio.Calib.QuietRoom="👍 Бөлмеде керемет тыныштық."

VoiceStudio.Monitor.On="🎧 Өзімді тыңдау (тыңдауды қосу)"
VoiceStudio.Monitor.Off="🔇 Тыңдауды өшіру"
VoiceStudio.Monitor.Tip="Осы микрофон үшін OBS бағдарламасындағы «Мониторинг және шығыс» режимін қосады: өзіңізді өңделген күйде естисіз және жүгірткілерді қалай жылжыту керегін бірден түсінесіз. Міндетті түрде құлаққаппен!"
VoiceStudio.Monitor.Info="Тыңдау дыбысы мына құрылғыға барады: %s. Құлаққап киіңіз — әйтпесе микрофон колонкаларды естіп, жаңғырық немесе ысқырық пайда болады. Құрылғыны «Баптаулар → Аудио → Кеңейтілген» бөлімінде өзгертуге болады. Тыңдау кезіндегі шағын кідіріс — қалыпты жағдай, жазбада ол болмайды."
VoiceStudio.Monitor.DefaultDevice="әдепкі құрылғы"

VoiceStudio.Bypass="🔁 Түпнұсқамен салыстыру (өңдеуді уақытша өшіру)"
VoiceStudio.Bypass.Tip="Дауысты өңдеусіз есту үшін құсбелгі қойыңыз, қайтару үшін алып тастаңыз. Осылай жақсарғанын оңай түсінесіз."

VoiceStudio.InputGain="Микрофон дыбысы"
VoiceStudio.InputGain.Tip="Өңдеуге дейін микрофон сигналын қаншалықты күшейту керек. «Ақылды баптау» оны өзі орнатады. Дауыс ақырын болса — көбейтіңіз, қырылдаса — азайтыңыз."

VoiceStudio.Denoise="🤖 ЖИ арқылы шуды басу (RNNoise 0.2 нейрожелісі)"
VoiceStudio.Denoise.Tip="Нейрожелі дауысты шудан ажыратып, желдеткішті, компьютер гуілін, көшені, пернетақтаны, бөлме жаңғырығын кетіреді."
VoiceStudio.Denoise.Amount="Күші"
VoiceStudio.Denoise.Amount.Tip="100% — шуды толығымен кетіру. Егер дауыс «құбырдағыдай» естілсе немесе сөз соңын жұтып қойса — 70–85%-ға дейін азайтыңыз: аздаған табиғи фон қалады."

VoiceStudio.Gate="🚪 Шу гейті (үзілістердегі тыныштық)"
VoiceStudio.Gate.Tip="Сіз үндемей тұрғанда дыбысты басады: тыныс, тінтуір шертуі, сөйлемдер арасындағы бөлме дыбыстары."
VoiceStudio.Gate.Mode="Сөйлеп тұрғаныңызды қалай анықтау"
VoiceStudio.Gate.Mode.Voice="🤖 Дауыс бойынша (ЖИ) — ұсынылады"
VoiceStudio.Gate.Mode.Level="📶 Дыбыс деңгейі бойынша (классикалық)"
VoiceStudio.Gate.Mode.Both="🤖+📶 Дауыс пен деңгей (шулы бөлмелерге)"
VoiceStudio.Gate.Mode.Tip="«Дауыс бойынша» — нейрожелі нақ сөйлеуді естиді және перне тықылынан гейтті ашпайды. «Дыбыс деңгейі бойынша» — шектен қатты естілетін бәрі. «Дауыс пен деңгей» — екі шарт бірге: ең қатаңы."
VoiceStudio.Gate.Threshold="Тыныштық шегі"
VoiceStudio.Gate.Threshold.Tip="Осы деңгейден ақырын дыбыстың бәрі үзіліс деп саналады. Ақырын сөздер кесіліп қалса — солға жылжытыңыз. Сөйлемдер арасында шу естілсе — оңға. «Ақылды баптау» таңдайды."
VoiceStudio.Gate.Range="Үзілістерді қаншалықты басу"
VoiceStudio.Gate.Range.Tip="−20 дБ — үзілістер айтарлықтай ақырын, бірақ табиғи естіледі. −60 дБ — толық тыныштық. 0 — гейт ештеңе істемейді."
VoiceStudio.Gate.VadSens="Дауысқа сезімталдық"
VoiceStudio.Gate.VadSens.Tip="Жоғары болса — гейт сыбырға да ашылады, төмен болса — тек сенімді сөзге."
VoiceStudio.Gate.Attack="Шабуыл (ашылу)"
VoiceStudio.Gate.Attack.Tip="Сөйлей бастағанда гейт қаншалықты жылдам ашылады."
VoiceStudio.Gate.Hold="Ұстап тұру"
VoiceStudio.Gate.Hold.Tip="Сөз соңы кесілмеуі үшін сөйлем біткеннен кейін гейт қанша уақыт ашық тұрады."
VoiceStudio.Gate.Release="Қалпына келу (жабылу)"
VoiceStudio.Gate.Release.Tip="Сөйлемнен кейін гейт қаншалықты бірқалыпты жабылады."

VoiceStudio.Eq="🎚 Эквалайзер (дауыс тембрі)"
VoiceStudio.Eq.Tip="Дауыс бояуын өзгертеді: төменгі жиілікті, анықтықты, «ауаны» көбейтеді не азайтады. «Ақылды баптау» оны микрофоныңызға бейімдейді."
VoiceStudio.Hpf="Төменгі гуіл мен тықылды кетіру"
VoiceStudio.Hpf.Tip="Ең төменгі жиіліктерді кеседі: гуілді, үстелді соққанды, тұғырдың дірілін, микрофонға тыныс алғандағы «гүрсілді». Әрдайым дерлік қосулы қалдырған жөн."
VoiceStudio.Hpf.Freq="Төменін кесу"
VoiceStudio.Hpf.Freq.Tip="80 Гц — көптеген дауыстарға. 100–120 Гц — гуіл көп болса. Төмен ер дауыстары үшін 90 Гц-тен жоғары көтермеңіз."
VoiceStudio.Hpf.Slope="Кесу тіктігі"
VoiceStudio.Hpf.Slope12="12 дБ/окт — жұмсақ"
VoiceStudio.Hpf.Slope24="24 дБ/окт — күрт"
VoiceStudio.Eq.Low="Тереңдік (бас)"
VoiceStudio.Eq.Low.Tip="Плюс — дауыс салмақтырақ және «барқыттырақ». Минус — дауыс міңгірлесе немесе микрофон тым жақын болса."
VoiceStudio.Eq.LowFreq="«Тереңдік» жиілігі"
VoiceStudio.Eq.Mud="Күңгірлік (міңгірлеу)"
VoiceStudio.Eq.Mud.Tip="Минус бөлменің «картон», «бөшке» сияқты реңкін кетіреді — дауыс тазарады. Әдетте −2-ден −4-ке дейін қояды."
VoiceStudio.Eq.MudFreq="«Күңгірлік» жиілігі"
VoiceStudio.Eq.MudQ="«Күңгірлік» ені"
VoiceStudio.Eq.Q.Tip="Жолақ ені (сапалылық): аз болса — кеңірек және жұмсағырақ, көп болса — тар және нүктелі."
VoiceStudio.Eq.Nasal="Мұрын реңкі"
VoiceStudio.Eq.Nasal.Tip="Минус «мұрыннан шыққан», «телефондық» реңкті кетіреді. Плюс дауыстың ортасын тығызырақ етеді."
VoiceStudio.Eq.NasalFreq="«Мұрын реңкі» жиілігі"
VoiceStudio.Eq.NasalQ="«Мұрын реңкі» ені"
VoiceStudio.Eq.Pres="Айқындық (сөз анықтығы)"
VoiceStudio.Eq.Pres.Tip="Плюс — сөздер анығырақ және «жақынырақ» естіледі, дауыс музыка мен ойынға батып кетпейді. Дыбыс өткір бола бастаса — азайтыңыз."
VoiceStudio.Eq.PresFreq="«Айқындық» жиілігі"
VoiceStudio.Eq.PresQ="«Айқындық» ені"
VoiceStudio.Eq.Air="Ауа (жылтыр)"
VoiceStudio.Eq.Air.Tip="Плюс сергектік пен «қымбат» студиялық жылтыр қосады. Шыжыл естіле бастаса — азайтыңыз."
VoiceStudio.Eq.AirFreq="«Ауа» жиілігі"
VoiceStudio.Eq.Lpf="Жоғарысын кесу"
VoiceStudio.Eq.Lpf.Tip="Ең жоғары жиіліктерді кетіреді. 20000 Гц — өшірулі. 3400 Гц — телефон эффектісі."

VoiceStudio.Deess="🐍 Өткір ысылдаған дыбыстарды кетіру (с, ш, щ)"
VoiceStudio.Deess.Tip="Де-эссер дауыстың қалған бөлігіне тиіспей, тек өткір ысқырық және ысылдаған дыбыстарды басады."
VoiceStudio.Deess.Amount="Күші"
VoiceStudio.Deess.Amount.Tip="Көбірек болса — «с» мен «ш» дыбыстарын күштірек жұмсартады. Дауыс сақауланып кетсе — азайтыңыз."
VoiceStudio.Deess.Freq="Ысылдаған дыбыстар жиілігі"
VoiceStudio.Deess.Freq.Tip="Ысылдаған дыбыстар қай жиіліктен басталады. Әдетте 5000–7000 Гц: әйел дауыстарында жоғарырақ, ер дауыстарында төменірек."

VoiceStudio.Comp="🗜 Дыбыс деңгейін теңестіру (компрессор)"
VoiceStudio.Comp.Tip="Ақырын және қатты сөздердің дыбыс деңгейін жақындатады: дауыс біркелкі, тығыз және «радиодағыдай» естіледі, көрерменге дыбысты бұрап отырудың қажеті жоқ."
VoiceStudio.Comp.Amount="Күші"
VoiceStudio.Comp.Amount.Tip="30–40% — табиғи. 50–70% — радиодағыдай тығыз. Одан жоғары — күшті эффект. Жалпы дыбыс деңгейі автоматты түрде реттеледі."
VoiceStudio.Comp.Attack="Шабуыл"
VoiceStudio.Comp.Attack.Tip="Компрессор қатты дыбысқа қаншалықты жылдам әрекет етеді. Аз болса — бақылау қатаңырақ, көп болса — сөз басы жандырақ."
VoiceStudio.Comp.Release="Қалпына келу"
VoiceStudio.Comp.Release.Tip="Қатты дыбыстан кейін компрессор қаншалықты жылдам «босатады»."

VoiceStudio.Warmth="🔥 Жылулық (лампалық реңк)"
VoiceStudio.Warmth.Tip="Лампалық студиялық жабдықтағыдай жұмсақ гармоникалар қосады: дауыс тығызырақ және барқыттырақ болады."
