VoiceStudio.Voice="🎭 Дауысты өзгерту"
VoiceStudio.Voice.Tip="Дауыстың биіктігі мен «көлемін» өзгертеді. Форманттарды сақтау дауысты табиғи қалдырады — бурундук эффектісінсіз."
VoiceStudio.Voice.Pitch="Дауыс биіктігі"
VoiceStudio.Voice.Pitch.Tip="Жартылай тонмен: −2 — сәл төмен, −12 — бір октава төмен, +12 — бір октава жоғары. Табиғи дыбыс үшін ±3 шегінде ұстаңыз."
VoiceStudio.Voice.Formant="Тембр (дауыстың «көлемі»)"
VoiceStudio.Voice.Formant.Tip="Биіктікті өзгертпей, бояуын өзгертеді: минус — дауыс «үлкенірек», ересек әрі ер адамға ұқсас, плюс — «кішірек», жасырақ."
VoiceStudio.Voice.Preserve="Табиғилықты сақтау (форманттар)"
VoiceStudio.Voice.Preserve.Tip="Қосулы — биіктік өзгергенде тембр өзіңіздікі болып қалады. Өшірулі — классикалық эффект: жоғары — бурундук, төмен — баяулатылған таспа."
VoiceStudio.Voice.Quality="Сапа"
VoiceStudio.Voice.Quality.High="Жоғары (кідіріс ~43 мс)"
VoiceStudio.Voice.Quality.Fast="Жылдам (кідіріс ~21 мс)"
VoiceStudio.Voice.Quality.Tip="Жоғары сапа төмен дауыстарда жақсырақ естіледі. Жылдам режим өзіңізді тыңдағанда кідірісті азайтады."
VoiceStudio.Voice.Note="ℹ Дауысты өзгерту дыбысқа шағын кідіріс қосады. Егер жазбада ерін қимылы дыбысқа сәл сәйкес келмесе, OBS бағдарламасында бейне немесе микрофон үшін «Кеңейтілген аудио қасиеттері → Синхрондау ығысуы» параметрін орнатыңыз."

