VoiceStudio.OutputGain.Tip="Плагин шығысындағы дауыс деңгейі. OBS микшеріндегі индикаторды бақылаңыз: сөз сары аймаққа жетуі керек, бірақ қызылға жетпеуі керек."
VoiceStudio.Limiter="🛡 Шамадан тыс жүктемеден қорғау (лимитер)"
VoiceStudio.Limiter.Tip="Айқай, күлкі немесе жөтел кезінде дауыстың «қырылдауына» жол бермейді. Әрқашан қосулы ұстаған дұрыс."
