VoiceStudio.Voice="🎭 Үндү өзгөртүү"
VoiceStudio.Voice.Tip="Үндүн бийиктигин жана «өлчөмүн» өзгөртөт. Форманттарды сактоо үндү табигый калтырат — бурундук эффектиси жок."
VoiceStudio.Voice.Pitch="Үндүн бийиктиги"
VoiceStudio.Voice.Pitch.Tip="Жарым тон менен: −2 — бир аз төмөн, −12 — бир октава төмөн, +12 — бир октава жогору. Табигый үн үчүн ±3 чегинде кармаңыз."
VoiceStudio.Voice.Formant="Тембр (үндүн «өлчөмү»)"
VoiceStudio.Voice.Formant.Tip="Бийиктикти өзгөртпөй, өңүн өзгөртөт: минус — үн «чоңураак», улуураак жана эркекчирээк, плюс — «кичирээк», жашыраак."
VoiceStudio.Voice.Preserve="Табигыйлыкты сактоо (форманттар)"
VoiceStudio.Voice.Preserve.Tip="Күйүк — бийиктик өзгөргөндө тембр өзүңүздүкү бойдон калат. Өчүк — классикалык эффект: жогору — бурундук, төмөн — жайлатылган тасма."
VoiceStudio.Voice.Quality="Сапат"
VoiceStudio.Voice.Quality.High="Жогорку (кечигүү ~43 мс)"
VoiceStudio.Voice.Quality.Fast="Тез (кечигүү ~21 мс)"
VoiceStudio.Voice.Quality.Tip="Жогорку сапат жоон үндөрдө жакшыраак угулат. Тез режим өзүңүздү угуп жатканда кечигүүнү азайтат."
VoiceStudio.Voice.Note="ℹ Үндү өзгөртүү бир аз кечигүү кошот. Эгер жазууда эриндер үнгө бир аз дал келбесе, OBS программасында видео же микрофон үчүн «Кеңейтилген аудио касиеттери → Синхрондоштуруу жылышы» параметрин коюңуз."

VoiceStudio.OutputGain="Акыркы катуулук"
VoiceStudio.OutputGain.Tip="Плагиндин чыгышындагы үндүн катуулугу. OBS микшериндеги индикаторду караңыз: сүйлөө сары аймакка жетиши керек, бирок кызылга жетпеши керек."
VoiceStudio.Limiter="🛡 Ашыкча жүктөөдөн коргоо (лимитер)"
VoiceStudio.Limiter.Tip="Кыйкырыкта, күлкүдө же жөтөлдө үндүн «карылдап» кетишине жол бербейт. Ар дайым күйгүзүлгөн бойдон калтырган жакшы."
