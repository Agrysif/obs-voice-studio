VoiceStudio.Mode.Tip="Жөнөкөй режим түшүнүктүү жылдыргычтарды гана көрсөтөт. Эксперт режими жыштыктарды, сапат факторун (Q), чабуул жана калыбына келүү убактысын кошот. Режимди которгондо үн өзгөрбөйт."

VoiceStudio.Guide="Кантип колдонуу керек — 3 кадам:\n1. Даяр үн стилин тандаңыз.\n2. «✨ Акылдуу жөндөө» баскычын басып, 10 секунд кадимки үнүңүз менен, тыным жасап сүйлөңүз.\n3. «🎧 Өзүмдү угуу» баскычын басып, кулакчын кийип, жылдыргычтарды каалагандай жылдырыңыз.\nАталыштын жанындагы кеңеш белгисине чычканды алып барыңыз — ал жерде ар бир жылдыргыч эмне кылары түшүндүрүлгөн."

VoiceStudio.Preset="Үн стили"
VoiceStudio.Preset.Tip="Ар кандай максаттар үчүн даяр жөндөөлөр. Стилди тандаганда төмөнкү жылдыргычтар өзү коюлат. Микрофондун үнү жана гейттин босогосу өзгөрбөйт — аларды «Акылдуу жөндөө» тандайт."
VoiceStudio.Preset.Natural="🌿 Табигый жана таза"
VoiceStudio.Preset.Natural.Tip="«Эффекттерсиз» таза табигый үн: ызы-чууну, гуулду жана ышылдаган үндөрдү алып салат, сөздү бир аз даанараак кылат. Дээрлик бардыгына ылайыктуу."
VoiceStudio.Preset.Podcast="🎙 Подкаст / радио алып баруучу"
VoiceStudio.Preset.Podcast.Tip="Радиодогудай тыгыз, жакын, «кымбат» үн: төмөнкү жыштыкта баркыттуулук көбүрөөк, бирдей катуулук, жеңил лампалык жылуулук."
VoiceStudio.Preset.Stream="🎮 Стрим жана оюндар"
VoiceStudio.Preset.Stream.Tip="Максималдуу даанылык жана эч кандай ызы-чуу жок: үн оюндун үнүн жарып өтөт, баскычтоп менен желдеткич угулбайт."
VoiceStudio.Preset.Deep="🌙 Терең баркыттай"
VoiceStudio.Preset.Deep.Tip="Тембрдин эсебинен үн жоонураак жана салмактуураак угулат (бийиктиги өзгөрбөйт): төмөнкү жыштыктар көбүрөөк, жылуураак, жумшагыраак."
VoiceStudio.Preset.Bright="✨ Жаркын жана шыңгыраган"
VoiceStudio.Preset.Bright.Tip="Жылтырак кошулган сергек, «абадай» үн — тумчуккан микрофондор жана басынкы үндөр үчүн жакшы."
VoiceStudio.Preset.Noisy="🏠 Ызы-чуулуу бөлмө"
VoiceStudio.Preset.Noisy.Tip="Ызы-чуулуу бөлмө үчүн: желдеткич, көчө, механикалык баскычтоп. Эң күчтүү ызы-чуу басуу жана катаал гейт."
VoiceStudio.Preset.Minimal="🧹 Ызы-чууну гана алып салуу"
VoiceStudio.Preset.Minimal.Tip="Үн өзгөрбөйт — нейротармак ызы-чууну жана төмөнкү гуулду гана алып салат. Өз микрофонун ушул бойдон жактыргандар үчүн."
VoiceStudio.Preset.Phone="📞 Эффект: телефон / рация"
VoiceStudio.Preset.Phone.Tip="Бир аз карылдаган тар «телефондук» үн — көрүнүштөр жана видеолор үчүн."
VoiceStudio.Preset.Monster="👹 Эффект: желмогуз"
VoiceStudio.Preset.Monster.Tip="Жоон, зор үн: бийиктиги −5, үндүн «өлчөмү» чоңураак. Тамашалар жана каармандар үчүн."
VoiceStudio.Preset.Cartoon="🐿 Эффект: мультфильм"
VoiceStudio.Preset.Cartoon.Tip="Мультфильм каарманынын ичке, шайыр үнү."
VoiceStudio.Preset.Custom="🛠 Өз жөндөөм"
VoiceStudio.Preset.Custom.Tip="Жылдыргычтар өзгөрбөйт — баарын өзүңүз жөндөңүз."

VoiceStudio.Calib.Start="✨ Акылдуу жөндөө — үнүмө ылайыктоо (10 сек)"
VoiceStudio.Calib.Stop="⏹ Талдоону токтотуу"
VoiceStudio.Calib.Tip="Плагин микрофонду 10 секунд угат. Нейротармак сүйлөөнү тынымдардан өзү ажыратып, үндүн катуулугун, бөлмөнүн ызы-чуусун, ышылдаган үндөрдү жана тембрди өлчөйт, андан кийин күчөтүүнү, ызы-чуу басууну, гейтти, компрессорду, де-эссерди жана эквалайзерди жөндөйт. Кайра иштетсе болот — оңдоолор топтолбойт."
VoiceStudio.Calib.Hint="Жогорудагы баскычты басып, кыска тынымдар менен кадимки үнүңүз менен сүйлөңүз — мисалы, эмнени жаздырайын деп жатканыңызды айтып бериңиз."
VoiceStudio.Calib.Listening="🎙 Угуп жатам… Кадимки үнүңүз менен сүйлөңүз, сүйлөмдөрдүн ортосунда тыным жасаңыз. %d сек калды.\n(Эгер эсептөө бир жерде турса — чыпка күйгүзүлгөнүн жана микрофон иштеп жатканын текшериңиз.)"
VoiceStudio.Calib.Cancelled="Талдоо токтотулду. Жөндөөлөр өзгөргөн жок."
VoiceStudio.Calib.NoVoice="⚠ Үндү угуу мүмкүн болбоду. Булакта туура микрофон тандалганын, ал Windows системасында өчүрүлбөгөнүн текшериңиз жана талдоо учурунда сүйлөңүз. Андан кийин жөндөөнү кайра иштетиңиз."
VoiceStudio.Calib.Done="✅ Даяр! Үн: %.0f дБ, бөлмөнүн ызы-чуусу: %.0f дБ (кор %.0f дБ). Микрофонду күчөтүү: %+.1f дБ.\nЖылдыргычтар үнүңүзгө ылайыкталды — угууну күйгүзүп, баалаңыз."
VoiceStudio.Calib.TooQuiet="⚠ Микрофон өтө акырын угулат. Анын деңгээлин Windows системасында (Жөндөөлөр → Үн → Киргизүү → Үн катуулугу) же үн картасында көтөрүп, жөндөөнү кайталаңыз."
VoiceStudio.Calib.Clipping="⚠ Микрофон ашыкча жүктөлүп жатат (катуу сөздөрдө карылдайт). Анын деңгээлин Windows системасында же үн картасында төмөндөтүп, жөндөөнү кайталаңыз."
VoiceStudio.Calib.Noisy="ℹ Бөлмөдө бир топ ызы-чуу бар — ызы-чуу басуу толук күчкө коюлду. «🏠 Ызы-чуулуу бөлмө» стилин колдонуп көрүңүз."
VoiceStudio.Calib.QuietRoom="👍 Бөлмөдө сонун тынчтык."

VoiceStudio.Monitor.On="🎧 Өзүмдү угуу (угууну күйгүзүү)"
VoiceStudio.Monitor.Off="🔇 Угууну өчүрүү"
VoiceStudio.Monitor.Tip="Бул микрофон үчүн OBS программасындагы «Мониторинг жана чыгаруу» режимин күйгүзөт: өзүңүздү иштетилген үн менен угасыз жана жылдыргычтарды кантип жылдыруу керектигин дароо түшүнөсүз. Сөзсүз кулакчын менен!"
VoiceStudio.Monitor.Info="Угуу үнү бул түзмөккө барат: %s. Кулакчын кийиңиз — антпесе микрофон колонкаларды угуп, жаңырык же ышкырык пайда болот. Түзмөктү «Жөндөөлөр → Аудио → Кеңейтилген» бөлүмүндө өзгөртсө болот. Угуу учурундагы кичине кечигүү — кадимки көрүнүш, жазууда ал болбойт."
VoiceStudio.Monitor.DefaultDevice="демейки түзмөк"

VoiceStudio.Bypass="🔁 Түп нуска менен салыштыруу (иштетүүнү убактылуу өчүрүү)"
VoiceStudio.Bypass.Tip="Үнүңүздү иштетүүсүз угуу үчүн белги коюңуз, кайтаруу үчүн алып салыңыз. Ошентип жакшырганын оңой түшүнөсүз."

VoiceStudio.InputGain="Микрофондун үнү"
VoiceStudio.InputGain.Tip="Иштетүүгө чейин микрофондун сигналын канчалык күчөтүү керек. «Акылдуу жөндөө» аны өзү коёт. Үн акырын болсо — кошуңуз, карылдаса — азайтыңыз."

VoiceStudio.Denoise="🤖 ЖИ менен ызы-чууну басуу (RNNoise 0.2 нейротармагы)"
VoiceStudio.Denoise.Tip="Нейротармак үндү ызы-чуудан айырмалап, желдеткичти, компьютердин гуулун, көчөнү, баскычтопту, бөлмөнүн жаңырыгын алып салат."
VoiceStudio.Denoise.Amount="Күчү"
VoiceStudio.Denoise.Amount.Tip="100% — ызы-чууну толугу менен алып салуу. Эгер үн «түтүктүн ичиндегидей» угулса же сөздүн аягын жутуп койсо — 70–85% чейин азайтыңыз: бир аз табигый фон калат."

VoiceStudio.Gate="🚪 Ызы-чуу гейти (тынымдарда тынчтык)"
VoiceStudio.Gate.Tip="Сиз унчукпай турганда үндү басаңдатат: дем алуу, чычкандын чыкылдашы, сүйлөмдөрдүн ортосундагы бөлмө үндөрү."
VoiceStudio.Gate.Mode="Сүйлөп жатканыңызды кантип аныктоо"
VoiceStudio.Gate.Mode.Voice="🤖 Үн боюнча (ЖИ) — сунушталат"
