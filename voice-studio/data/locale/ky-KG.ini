VoiceStudio.Eq.Low.Tip="Плюс — үн салмактуураак жана «баркыттуураак». Минус — үн дүңгүрөсө же микрофон өтө жакын болсо."
VoiceStudio.Eq.LowFreq="«Тереңдик» жыштыгы"
VoiceStudio.Eq.Mud="Күңүрттүк (дүңгүрөө)"
VoiceStudio.Eq.Mud.Tip="Минус бөлмөнүн «картон», «бочка» сыяктуу добушун алып салат — үн тазараак болот. Адатта −2-ден −4-кө чейин коюшат."
VoiceStudio.Eq.MudFreq="«Күңүрттүк» жыштыгы"
VoiceStudio.Eq.MudQ="«Күңүрттүк» кеңдиги"
VoiceStudio.Eq.Q.Tip="Тилкенин кеңдиги (сапат фактору): азыраак — кеңирээк жана жумшагыраак, көбүрөөк — тар жана так."
VoiceStudio.Eq.Nasal="Мурун үнү"
VoiceStudio.Eq.Nasal.Tip="Минус «мурундан чыккан», «телефондук» өңдү алып салат. Плюс үндүн ортосун тыгызыраак кылат."
VoiceStudio.Eq.NasalFreq="«Мурун үнү» жыштыгы"
