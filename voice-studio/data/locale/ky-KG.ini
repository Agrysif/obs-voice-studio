VoiceStudio.Eq.Tip="Үндүн өңүн өзгөртөт: төмөнкү жыштыкты, даанылыкты, «абаны» көбөйтөт же азайтат. «Акылдуу жөндөө» аны микрофонуңузга ылайыктайт."
VoiceStudio.Hpf="Төмөнкү гуулду жана тыкылдарды алып салуу"
VoiceStudio.Hpf.Tip="Эң төмөнкү жыштыктарды кесет: гуулду, столду тыкылдатууну, штативдин титирөөсүн, микрофонго дем алгандагы «дүңгүрөөнү». Дээрлик ар дайым күйгүзүлгөн бойдон калтырган жакшы."
