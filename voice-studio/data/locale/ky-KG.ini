VoiceStudio.Deess.Tip="Де-эссер үндүн калган бөлүгүнө тийбестен, курч ышкырган жана ышылдаган үндөрдү гана басаңдатат."
VoiceStudio.Deess.Amount="Күчү"
VoiceStudio.Deess.Amount.Tip="Көбүрөөк болсо — «с» жана «ш» үндөрүн күчтүүрөөк жумшартат. Эгер сөз чулдурап калса — азайтыңыз."
VoiceStudio.Deess.Freq="Ышылдаган үндөрдүн жыштыгы"
