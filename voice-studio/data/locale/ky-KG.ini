VoiceStudio.Gate.Mode.Both="🤖+📶 Үн жана катуулук (ызы-чуулуу бөлмөлөр үчүн)"
VoiceStudio.Gate.Mode.Tip="«Үн боюнча» — нейротармак так сүйлөөнү угат жана баскычтардын тыкылдашына гейтти ачпайт. «Катуулук боюнча» — босогодон катуураак баары. «Үн жана катуулук» — эки шарт тең: эң катаалы."
VoiceStudio.Gate.Threshold="Тынчтык босогосу"
VoiceStudio.Gate.Threshold.Tip="Бул деңгээлден акырыныраак баары тыным деп эсептелет. Акырын сөздөр кесилип калса — солго жылдырыңыз. Сүйлөмдөрдүн ортосунда ызы-чуу угулса — оңго. «Акылдуу жөндөө» тандайт."
VoiceStudio.Gate.Range="Тынымдарды канчалык басаңдатуу"
VoiceStudio.Gate.Range.Tip="−20 дБ — тынымдар байкаларлык акырын, бирок табигый угулат. −60 дБ — толук тынчтык. 0 — гейт эч нерсе кылбайт."
VoiceStudio.Gate.VadSens="Үнгө сезгичтик"
