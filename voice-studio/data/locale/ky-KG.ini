VoiceStudio.Gate.Attack="Чабуул (ачылуу)"
VoiceStudio.Gate.Attack.Tip="Сүйлөй баштаганда гейт канчалык тез ачылат."
VoiceStudio.Gate.Hold="Кармап туруу"
VoiceStudio.Gate.Hold.Tip="Сөздөрдүн аягы кесилбеши үчүн сүйлөм бүткөндөн кийин гейт канча убакыт ачык турат."
VoiceStudio.Gate.Release="Калыбына келүү (жабылуу)"
VoiceStudio.Gate.Release.Tip="Сүйлөмдөн кийин гейт канчалык жай жабылат."

