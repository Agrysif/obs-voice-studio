VoiceStudio.Comp.Tip="Акырын жана катуу сөздөрдүн катуулугун жакындатат: үн бирдей, тыгыз жана «радиодогудай» угулат, көрүүчүгө үндү буруп отуруунун кереги жок."
VoiceStudio.Comp.Amount="Күчү"
VoiceStudio.Comp.Amount.Tip="30–40% — табигый. 50–70% — радиодогудай тыгыз. Андан жогору — күчтүү эффект. Жалпы катуулук автоматтык түрдө жөнгө салынат."
VoiceStudio.Comp.Attack="Чабуул"
VoiceStudio.Comp.Attack.Tip="Компрессор катуу үнгө канчалык тез реакция кылат. Азыраак — көзөмөл катаалыраак, көбүрөөк — сөздүн башы жандуураак."
VoiceStudio.Comp.Release="Калыбына келүү"
VoiceStudio.Comp.Release.Tip="Катуу үндөн кийин компрессор канчалык тез «коё берет»."

VoiceStudio.Warmth="🔥 Жылуулук (лампалык өң)"
VoiceStudio.Warmth.Tip="Лампалуу студиялык жабдыктагыдай жумшак гармоникаларды кошот: үн тыгызыраак жана баркыттуураак болот."
