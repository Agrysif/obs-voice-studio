VoiceStudio.FilterName="🎙 Голосовая студия"
VoiceStudio.Description="Студийная обработка голоса для записи и стримов: ИИ-шумоподавление, умная автонастройка, эквалайзер, компрессор, де-эссер, смена голоса."

VoiceStudio.Unit.dB=" дБ"
VoiceStudio.Unit.Hz=" Гц"
VoiceStudio.Unit.ms=" мс"
VoiceStudio.Unit.Percent=" %"
VoiceStudio.Unit.Semitones=" пт"

VoiceStudio.Mode="Режим настроек"
VoiceStudio.Mode.Simple="🙂 Простой — только главное"
VoiceStudio.Mode.Expert="🛠 Эксперт — все параметры"
VoiceStudio.Mode.Tip="Простой режим показывает только понятные ползунки. Эксперт добавляет частоты, добротность, время атаки и восстановления. Звук от переключения режима не меняется."

VoiceStudio.Guide="Как пользоваться — 3 шага:\n1. Выберите готовый стиль звучания.\n2. Нажмите «✨ Умная настройка» и 10 секунд говорите обычным голосом, с паузами.\n3. Нажмите «🎧 Слушать себя», наденьте наушники и двигайте ползунки по вкусу.\nНаведите мышь на значок подсказки рядом с названием — там объяснено, что делает каждый ползунок."

VoiceStudio.Preset="Стиль звучания"
VoiceStudio.Preset.Tip="Готовые настройки под разные задачи. При выборе стиля ползунки ниже выставятся автоматически. Громкость микрофона и порог гейта при этом не меняются — их подбирает «Умная настройка»."
VoiceStudio.Preset.Natural="🌿 Естественный и чистый"
VoiceStudio.Preset.Natural.Tip="Чистый натуральный голос без «эффектов»: убирает шум, гул и шипящие, слегка добавляет разборчивости. Хорош почти для всего."
VoiceStudio.Preset.Podcast="🎙 Подкаст / радиоведущий"
VoiceStudio.Preset.Podcast.Tip="Плотный, близкий, «дорогой» голос как на радио: больше бархата внизу, ровная громкость, лёгкое ламповое тепло."
VoiceStudio.Preset.Stream="🎮 Стрим и игры"
VoiceStudio.Preset.Stream.Tip="Максимум разборчивости и никакого шума: голос пробивается сквозь звук игры, клавиатура и вентилятор не слышны."
VoiceStudio.Preset.Deep="🌙 Глубокий бархатный"
VoiceStudio.Preset.Deep.Tip="Голос звучит ниже и солиднее за счёт тембра (без изменения высоты): больше низов, теплее, мягче."
VoiceStudio.Preset.Bright="✨ Яркий и звонкий"
VoiceStudio.Preset.Bright.Tip="Свежий, «воздушный» голос с блеском — хорошо для глухих микрофонов и тёмных голосов."
VoiceStudio.Preset.Noisy="🏠 Шумная комната"
VoiceStudio.Preset.Noisy.Tip="Для шумного помещения: вентилятор, улица, механическая клавиатура. Самое сильное шумоподавление и строгий гейт."
VoiceStudio.Preset.Minimal="🧹 Только убрать шум"
VoiceStudio.Preset.Minimal.Tip="Голос не меняется — только нейросеть убирает шум и низкий гул. Для тех, кому нравится свой микрофон как есть."
VoiceStudio.Preset.Phone="📞 Эффект: телефон / рация"
VoiceStudio.Preset.Phone.Tip="Узкий «телефонный» звук с лёгким хрипом — для сценок и роликов."
VoiceStudio.Preset.Monster="👹 Эффект: монстр"
VoiceStudio.Preset.Monster.Tip="Низкий огромный голос: высота −5, «размер» голоса больше. Для шуток и персонажей."
VoiceStudio.Preset.Cartoon="🐿 Эффект: мультяшный"
VoiceStudio.Preset.Cartoon.Tip="Высокий весёлый голос персонажа мультфильма."
VoiceStudio.Preset.Custom="🛠 Своя настройка"
VoiceStudio.Preset.Custom.Tip="Ползунки не меняются — настраивайте всё сами."

VoiceStudio.Calib.Start="✨ Умная настройка под мой голос (10 сек)"
VoiceStudio.Calib.Stop="⏹ Остановить анализ"
VoiceStudio.Calib.Tip="Плагин послушает микрофон 10 секунд. Нейросеть сама отделит речь от пауз, измерит громкость голоса, шум комнаты, шипящие и тембр, а затем подстроит усиление, шумоподавление, гейт, компрессор, де-эссер и эквалайзер. Можно запускать повторно — поправки не накапливаются."
VoiceStudio.Calib.Hint="Нажмите кнопку выше и говорите обычным голосом с небольшими паузами — например, расскажите, что собираетесь записывать."
VoiceStudio.Calib.Listening="🎙 Слушаю… Говорите обычным голосом, делайте паузы между фразами. Осталось %d сек.\n(Если отсчёт стоит на месте — проверьте, что фильтр включён и микрофон работает.)"
VoiceStudio.Calib.Cancelled="Анализ остановлен. Настройки не изменились."
VoiceStudio.Calib.NoVoice="⚠ Не удалось услышать голос. Проверьте, что в источнике выбран нужный микрофон, он не выключен в Windows, и говорите во время анализа. Затем запустите настройку ещё раз."
VoiceStudio.Calib.Done="✅ Готово! Голос: %.0f дБ, шум комнаты: %.0f дБ (запас %.0f дБ). Усиление микрофона: %+.1f дБ.\nПолзунки подстроены под ваш голос — включите прослушивание и оцените."
VoiceStudio.Calib.TooQuiet="⚠ Микрофон звучит очень тихо. Увеличьте его уровень в Windows (Параметры → Звук → Ввод → Громкость) или на звуковой карте и повторите настройку."
VoiceStudio.Calib.Clipping="⚠ Микрофон перегружается (хрипит на громких словах). Уменьшите его уровень в Windows или на звуковой карте и повторите настройку."
VoiceStudio.Calib.Noisy="ℹ В комнате довольно шумно — шумоподавление включено на полную. Попробуйте стиль «🏠 Шумная комната»."
VoiceStudio.Calib.QuietRoom="👍 В комнате отличная тишина."

VoiceStudio.Monitor.On="🎧 Слушать себя (включить прослушивание)"
VoiceStudio.Monitor.Off="🔇 Выключить прослушивание"
VoiceStudio.Monitor.Tip="Ставит этому микрофону в OBS режим «Прослушивание включено»: вы слышите себя уже с обработкой и сразу понимаете, как двигать ползунки. Обязательно в наушниках!"
VoiceStudio.Monitor.Info="Звук прослушивания идёт на: %s. Наденьте наушники — иначе микрофон услышит колонки, и появится эхо или свист. Устройство меняется в «Настройки → Аудио → Расширенные». Небольшая задержка при прослушивании — это нормально, в записи её нет."
VoiceStudio.Monitor.DefaultDevice="устройство по умолчанию"

VoiceStudio.Bypass="🔁 Сравнить с оригиналом (временно выключить обработку)"
VoiceStudio.Bypass.Tip="Поставьте галочку, чтобы услышать голос без обработки, снимите — чтобы вернуть. Так легко понять, стало ли лучше."

VoiceStudio.InputGain="Громкость микрофона"
VoiceStudio.InputGain.Tip="Насколько усилить сигнал микрофона до обработки. «Умная настройка» выставляет его сама. Если голос тихий — прибавьте, если хрипит — убавьте."

VoiceStudio.Denoise="🤖 ИИ-шумоподавление (нейросеть RNNoise 0.2)"
VoiceStudio.Denoise.Tip="Нейросеть отличает голос от шума и убирает вентилятор, гул компьютера, улицу, клавиатуру, эхо комнаты."
VoiceStudio.Denoise.Amount="Сила"
VoiceStudio.Denoise.Amount.Tip="100% — убрать шум полностью. Если голос звучит «как в трубе» или проглатывает окончания — уменьшите до 70–85%: немного естественного фона останется."

VoiceStudio.Gate="🚪 Шумовой гейт (тишина в паузах)"
VoiceStudio.Gate.Tip="Приглушает звук, когда вы молчите: дыхание, щелчки мыши, звуки комнаты между фразами."
VoiceStudio.Gate.Mode="Как понимать, что вы говорите"
VoiceStudio.Gate.Mode.Voice="🤖 По голосу (ИИ) — рекомендуется"
VoiceStudio.Gate.Mode.Level="📶 По громкости (классический)"
VoiceStudio.Gate.Mode.Both="🤖+📶 Голос и громкость (для шумных комнат)"
VoiceStudio.Gate.Mode.Tip="«По голосу» — нейросеть слышит именно речь и не открывает гейт на стук клавиш. «По громкости» — всё, что громче порога. «Голос и громкость» — оба условия сразу: строже всего."
VoiceStudio.Gate.Threshold="Порог тишины"
VoiceStudio.Gate.Threshold.Tip="Всё тише этого уровня считается паузой. Если обрезаются тихие слова — сдвиньте влево. Если между фразами слышен шум — вправо. Подбирается «Умной настройкой»."
VoiceStudio.Gate.Range="Насколько приглушать паузы"
VoiceStudio.Gate.Range.Tip="−20 дБ — паузы заметно тише, но звучит естественно. −60 дБ — полная тишина. 0 — гейт ничего не делает."
VoiceStudio.Gate.VadSens="Чувствительность к голосу"
VoiceStudio.Gate.VadSens.Tip="Выше — гейт открывается даже на шёпот, ниже — только на уверенную речь."
VoiceStudio.Gate.Attack="Атака (открытие)"
VoiceStudio.Gate.Attack.Tip="Как быстро гейт открывается, когда вы начали говорить."
VoiceStudio.Gate.Hold="Удержание"
VoiceStudio.Gate.Hold.Tip="Сколько гейт остаётся открытым после окончания фразы — чтобы не обрезать окончания слов."
VoiceStudio.Gate.Release="Восстановление (закрытие)"
VoiceStudio.Gate.Release.Tip="Как плавно гейт закрывается после фразы."

VoiceStudio.Eq="🎚 Эквалайзер (тембр голоса)"
VoiceStudio.Eq.Tip="Меняет окраску голоса: больше или меньше низов, разборчивости, «воздуха». «Умная настройка» подстраивает его под ваш микрофон."
VoiceStudio.Hpf="Убрать низкий гул и стуки"
VoiceStudio.Hpf.Tip="Срезает самые низкие частоты: гул, стук по столу, вибрацию стойки, «бубнение» от дыхания в микрофон. Почти всегда стоит оставить включённым."
VoiceStudio.Hpf.Freq="Срезать ниже"
VoiceStudio.Hpf.Freq.Tip="80 Гц — для большинства голосов. 100–120 Гц — если много гула. Для низких мужских голосов не поднимайте выше 90 Гц."
VoiceStudio.Hpf.Slope="Крутизна среза"
VoiceStudio.Hpf.Slope12="12 дБ/окт — мягко"
VoiceStudio.Hpf.Slope24="24 дБ/окт — резко"
VoiceStudio.Eq.Low="Глубина (бас)"
VoiceStudio.Eq.Low.Tip="Плюс — голос солиднее и «бархатнее». Минус — если голос бубнит или микрофон слишком близко."
VoiceStudio.Eq.LowFreq="Частота «Глубины»"
VoiceStudio.Eq.Mud="Гулкость (бубнение)"
VoiceStudio.Eq.Mud.Tip="Минус убирает «картонный», «бочковый» призвук комнаты — голос становится чище. Обычно ставят от −2 до −4."
VoiceStudio.Eq.MudFreq="Частота «Гулкости»"
VoiceStudio.Eq.MudQ="Ширина «Гулкости»"
VoiceStudio.Eq.Q.Tip="Ширина полосы (добротность): меньше — шире и мягче, больше — узко и точечно."
VoiceStudio.Eq.Nasal="Гнусавость"
VoiceStudio.Eq.Nasal.Tip="Минус убирает «носовой», «телефонный» оттенок. Плюс делает голос плотнее в середине."
VoiceStudio.Eq.NasalFreq="Частота «Гнусавости»"
VoiceStudio.Eq.NasalQ="Ширина «Гнусавости»"
VoiceStudio.Eq.Pres="Чёткость (разборчивость)"
VoiceStudio.Eq.Pres.Tip="Плюс — слова звучат чётче и «ближе», голос не тонет в музыке и игре. Если звук становится резким — уменьшите."
VoiceStudio.Eq.PresFreq="Частота «Чёткости»"
VoiceStudio.Eq.PresQ="Ширина «Чёткости»"
VoiceStudio.Eq.Air="Воздух (блеск)"
VoiceStudio.Eq.Air.Tip="Плюс добавляет свежести и «дорогого» студийного блеска. Если стало слышно шипение — уменьшите."
VoiceStudio.Eq.AirFreq="Частота «Воздуха»"
VoiceStudio.Eq.Lpf="Срезать выше"
VoiceStudio.Eq.Lpf.Tip="Убирает самые высокие частоты. 20000 Гц — выключено. 3400 Гц — эффект телефона."

VoiceStudio.Deess="🐍 Убрать резкие шипящие (с, ш, щ)"
VoiceStudio.Deess.Tip="Де-эссер приглушает только резкие свистящие и шипящие звуки, не трогая остальной голос."
VoiceStudio.Deess.Amount="Сила"
VoiceStudio.Deess.Amount.Tip="Больше — сильнее смягчает «с» и «ш». Если голос начал шепелявить — уменьшите."
VoiceStudio.Deess.Freq="Частота шипящих"
VoiceStudio.Deess.Freq.Tip="С какой частоты считаются шипящие. Обычно 5000–7000 Гц: у женских голосов выше, у мужских ниже."

VoiceStudio.Comp="🗜 Выравнивание громкости (компрессор)"
VoiceStudio.Comp.Tip="Делает тихие и громкие слова ближе по громкости: голос звучит ровно, плотно и «радийно», зрителю не нужно крутить громкость."
VoiceStudio.Comp.Amount="Сила"
VoiceStudio.Comp.Amount.Tip="30–40% — естественно. 50–70% — плотно, как на радио. Выше — сильный эффект. Общая громкость подстраивается автоматически."
VoiceStudio.Comp.Attack="Атака"
VoiceStudio.Comp.Attack.Tip="Как быстро компрессор реагирует на громкий звук. Меньше — жёстче контроль, больше — живее начала слов."
VoiceStudio.Comp.Release="Восстановление"
VoiceStudio.Comp.Release.Tip="Как быстро компрессор «отпускает» после громкого звука."

VoiceStudio.Warmth="🔥 Тепло (ламповый окрас)"
VoiceStudio.Warmth.Tip="Добавляет мягкие гармоники, как у лампового студийного оборудования: голос становится плотнее и бархатнее."
VoiceStudio.Warmth.Amount="Сила"
VoiceStudio.Warmth.Amount.Tip="20–40% — лёгкое тепло. Больше — заметный «винтажный» хрип."

VoiceStudio.Voice="🎭 Изменение голоса"
VoiceStudio.Voice.Tip="Меняет высоту и «размер» голоса. Сохранение формант оставляет голос естественным — без эффекта бурундука."
VoiceStudio.Voice.Pitch="Высота голоса"
VoiceStudio.Voice.Pitch.Tip="В полутонах: −2 — чуть ниже, −12 — на октаву ниже, +12 — на октаву выше. Для естественного звучания держитесь в пределах ±3."
VoiceStudio.Voice.Formant="Тембр («размер» голоса)"
VoiceStudio.Voice.Formant.Tip="Меняет окраску, не меняя высоту: минус — голос «больше», взрослее и мужественнее, плюс — «меньше», моложе."
VoiceStudio.Voice.Preserve="Сохранять естественность (форманты)"
VoiceStudio.Voice.Preserve.Tip="Включено — при смене высоты тембр остаётся вашим. Выключено — классический эффект: вверх — бурундук, вниз — замедленная плёнка."
VoiceStudio.Voice.Quality="Качество"
VoiceStudio.Voice.Quality.High="Высокое (задержка ~43 мс)"
VoiceStudio.Voice.Quality.Fast="Быстрое (задержка ~21 мс)"
VoiceStudio.Voice.Quality.Tip="Высокое лучше звучит на низких голосах. Быстрое даёт меньшую задержку при прослушивании себя."
VoiceStudio.Voice.Note="ℹ Смена голоса добавляет небольшую задержку звука. Если на записи губы немного не совпадают со звуком, задайте в OBS «Расширенные свойства аудио → Сдвиг синхронизации» для видео или микрофона."

VoiceStudio.OutputGain="Итоговая громкость"
VoiceStudio.OutputGain.Tip="Громкость голоса на выходе плагина. Следите по индикатору в микшере OBS: речь должна доходить до жёлтой зоны, но не до красной."
VoiceStudio.Limiter="🛡 Защита от перегруза (лимитер)"
VoiceStudio.Limiter.Tip="Не даёт голосу «захрипеть» на крике, смехе или кашле. Лучше всегда держать включённым."
VoiceStudio.Limiter.Ceiling="Потолок громкости"
VoiceStudio.Limiter.Ceiling.Tip="Максимальный уровень на выходе. −1 дБ — стандартный безопасный запас."

VoiceStudio.Live.In="Вход"
VoiceStudio.Live.Out="Выход"
VoiceStudio.Live.Voice="ИИ слышит голос"
VoiceStudio.Live.Silence="Тишина"
VoiceStudio.Live.NoSignal="Нет звука с микрофона"
VoiceStudio.Live.Off="Фильтр выключен"
VoiceStudio.Live.Squeeze="сжатие %1 дБ"
VoiceStudio.Live.GatePause="пауза приглушена"
VoiceStudio.Live.EqHint="Эквалайзер: тяните точки мышью — влево-вправо частота, вверх-вниз громкость, колёсико над точкой — ширина, двойной щелчок — сброс. Серым показан спектр вашего голоса."
VoiceStudio.Live.EqOff="Эквалайзер выключен — включите его в разделе «Эквалайзер» ниже"
VoiceStudio.Live.Hpf="Срез гула"
VoiceStudio.Live.Low="Глубина"
VoiceStudio.Live.Mud="Гулкость"
VoiceStudio.Live.Nasal="Гнусавость"
VoiceStudio.Live.Pres="Чёткость"
VoiceStudio.Live.Air="Воздух"
VoiceStudio.Live.kHz=" кГц"

