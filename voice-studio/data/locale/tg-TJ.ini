VoiceStudio.FilterName="🎙 Студияи овоз"
VoiceStudio.Description="Коркарди студиявии овоз барои сабт ва стрим: коҳиши шовқин бо ЗС, танзими худкори зирак, эквалайзер, компрессор, де-эссер, тағйири овоз."

VoiceStudio.Unit.dB=" дБ"
VoiceStudio.Unit.Hz=" Гц"
VoiceStudio.Unit.ms=" мс"
VoiceStudio.Unit.Percent=" %"
VoiceStudio.Unit.Semitones=" нт"

VoiceStudio.Mode="Реҷаи танзимот"
VoiceStudio.Mode.Simple="🙂 Содда — танҳо асосӣ"
VoiceStudio.Mode.Expert="🛠 Коршинос — ҳамаи параметрҳо"
VoiceStudio.Mode.Tip="Реҷаи содда танҳо слайдерҳои фаҳморо нишон медиҳад. Реҷаи коршинос басомадҳо, Q (паҳнои банд), вақти ҳамла ва барқароршавиро илова мекунад. Иваз кардани реҷа садоро тағйир намедиҳад."

VoiceStudio.Guide="Тарзи истифода — 3 қадам:\n1. Услуби тайёри садоро интихоб кунед.\n2. Тугмаи «✨ Танзими зирак»-ро пахш кунед ва 10 сония бо овози муқаррарӣ, бо таваққуфҳо гап занед.\n3. Тугмаи «🎧 Худамро шунидан»-ро пахш кунед, гӯшмонак гузоред ва слайдерҳоро ба завқи худ ҳаракат диҳед.\nМушро ба нишонаи ёрӣ дар паҳлӯи ном баред — он ҷо шарҳ дода шудааст, ки ҳар слайдер чӣ кор мекунад."

VoiceStudio.Preset="Услуби садо"
VoiceStudio.Preset.Tip="Танзимоти тайёр барои вазифаҳои гуногун. Ҳангоми интихоби услуб слайдерҳои поён худкор танзим мешаванд. Баландии микрофон ва остонаи гейт тағйир намеёбанд — онҳоро «Танзими зирак» интихоб мекунад."
VoiceStudio.Preset.Natural="🌿 Табиӣ ва тоза"
VoiceStudio.Preset.Natural.Tip="Овози тоза ва табиӣ бе «эффектҳо»: шовқин, ғувиш ва «с»-ҳои тезро тоза мекунад, каме возеҳӣ илова мекунад. Қариб барои ҳама чиз мувофиқ аст."
VoiceStudio.Preset.Podcast="🎙 Подкаст / барандаи радио"
VoiceStudio.Preset.Podcast.Tip="Овози зич, наздик ва «гаронбаҳо» мисли радио: дар поён махмали бештар, баландии баробар, гармии сабуки лампавӣ."
VoiceStudio.Preset.Stream="🎮 Стрим ва бозиҳо"
VoiceStudio.Preset.Stream.Tip="Ҳадди аксар возеҳӣ ва ҳеҷ шовқин: овоз аз байни садои бозӣ равшан шунида мешавад, клавиатура ва вентилятор шунида намешаванд."
VoiceStudio.Preset.Deep="🌙 Амиқ ва махмалин"
VoiceStudio.Preset.Deep.Tip="Овоз аз ҳисоби тембр пасттар ва бовиқортар садо медиҳад (тон тағйир намеёбад): басомадҳои паст бештар, гармтар, нармтар."
VoiceStudio.Preset.Bright="✨ Равшан ва ҷарангдор"
VoiceStudio.Preset.Bright.Tip="Овози тару тоза, «ҳавоӣ» ва дурахшон — барои микрофонҳои гунг ва овозҳои тира хуб аст."
VoiceStudio.Preset.Noisy="🏠 Ҳуҷраи пуршовқин"
VoiceStudio.Preset.Noisy.Tip="Барои ҷои пуршовқин: вентилятор, кӯча, клавиатураи механикӣ. Қавитарин коҳиши шовқин ва гейти сахтгир."
VoiceStudio.Preset.Minimal="🧹 Танҳо тоза кардани шовқин"
VoiceStudio.Preset.Minimal.Tip="Овоз тағйир намеёбад — шабакаи нейронӣ танҳо шовқин ва ғувиши пастро тоза мекунад. Барои онҳое, ки микрофони худро ҳамон тавре ки ҳаст, дӯст медоранд."
VoiceStudio.Preset.Phone="📞 Эффект: телефон / ратсия"
VoiceStudio.Preset.Phone.Tip="Садои танги «телефонӣ» бо каме хиррос — барои саҳначаҳо ва видеоҳо."
VoiceStudio.Preset.Monster="👹 Эффект: ҳаюло"
VoiceStudio.Preset.Monster.Tip="Овози паст ва азим: тон −5, «андоза»-и овоз калонтар. Барои шӯхӣ ва қаҳрамонҳо."
VoiceStudio.Preset.Cartoon="🐿 Эффект: мултфилм"
VoiceStudio.Preset.Cartoon.Tip="Овози баланд ва шодмони қаҳрамони мултфилм."
VoiceStudio.Preset.Custom="🛠 Танзими худам"
VoiceStudio.Preset.Custom.Tip="Слайдерҳо тағйир намеёбанд — ҳамаашро худатон танзим кунед."

VoiceStudio.Calib.Start="✨ Танзими зирак барои овози ман (10 сония)"
VoiceStudio.Calib.Stop="⏹ Қатъ кардани таҳлил"
VoiceStudio.Calib.Tip="Плагин 10 сония микрофонро гӯш мекунад. Шабакаи нейронӣ худаш нутқро аз таваққуфҳо ҷудо мекунад, баландии овоз, шовқини ҳуҷра, «с»-ҳои тез ва тембрро чен мекунад, сипас пурзӯркунӣ, коҳиши шовқин, гейт, компрессор, де-эссер ва эквалайзерро мувофиқ мекунад. Метавонед такроран оғоз кунед — ислоҳҳо ҷамъ намешаванд."
VoiceStudio.Calib.Hint="Тугмаи болоро пахш кунед ва бо овози муқаррарӣ, бо таваққуфҳои хурд гап занед — масалан, нақл кунед, ки чиро сабт карданӣ ҳастед."
VoiceStudio.Calib.Listening="🎙 Гӯш мекунам… Бо овози муқаррарӣ гап занед, байни ибораҳо таваққуф кунед. %d сония монд.\n(Агар ҳисоб тағйир наёбад — санҷед, ки филтр фаъол аст ва микрофон кор мекунад.)"
VoiceStudio.Calib.Cancelled="Таҳлил қатъ шуд. Танзимот тағйир наёфт."
VoiceStudio.Calib.NoVoice="⚠ Овоз шунида нашуд. Санҷед, ки дар манбаъ микрофони дуруст интихоб шудааст ва он дар Windows хомӯш нест, ҳангоми таҳлил гап занед. Сипас танзимро аз нав оғоз кунед."
VoiceStudio.Calib.Done="✅ Тайёр! Овоз: %.0f дБ, шовқини ҳуҷра: %.0f дБ (захира %.0f дБ). Пурзӯркунии микрофон: %+.1f дБ.\nСлайдерҳо ба овози шумо мувофиқ карда шуданд — гӯшкуниро фаъол кунед ва баҳо диҳед."
VoiceStudio.Calib.TooQuiet="⚠ Микрофон хеле паст садо медиҳад. Сатҳи онро дар Windows (Танзимот → Садо → Вуруд → Баландии садо) ё дар корти садо зиёд кунед ва танзимро такрор кунед."
VoiceStudio.Calib.Clipping="⚠ Микрофон аз ҳад зиёд бор шудааст (дар калимаҳои баланд хиррос мекунад). Сатҳи онро дар Windows ё дар корти садо кам кунед ва танзимро такрор кунед."
VoiceStudio.Calib.Noisy="ℹ Дар ҳуҷра хеле шовқин аст — коҳиши шовқин пурра фаъол шуд. Услуби «🏠 Ҳуҷраи пуршовқин»-ро санҷед."
VoiceStudio.Calib.QuietRoom="👍 Дар ҳуҷра хомӯшии олӣ."

VoiceStudio.Monitor.On="🎧 Худамро шунидан (фаъол кардани гӯшкунӣ)"
VoiceStudio.Monitor.Off="🔇 Хомӯш кардани гӯшкунӣ"
VoiceStudio.Monitor.Tip="Дар OBS барои ин микрофон мониторинги аудиоро фаъол мекунад: шумо худро аллакай бо коркард мешунавед ва фавран мефаҳмед, ки слайдерҳоро чӣ тавр ҳаракат диҳед. Ҳатман бо гӯшмонак!"
VoiceStudio.Monitor.Info="Садои гӯшкунӣ ба ин дастгоҳ меравад: %s. Гӯшмонак гузоред — вагарна микрофон баландгӯякҳоро мешунавад ва акси садо ё ҳуштак пайдо мешавад. Дастгоҳро дар «Settings → Audio → Advanced» (Танзимот → Аудио → Иловагӣ) иваз кардан мумкин аст. Таъхири хурд ҳангоми гӯшкунӣ муқаррарӣ аст, дар сабт он нест."
VoiceStudio.Monitor.DefaultDevice="дастгоҳи пешфарз"

VoiceStudio.Bypass="🔁 Муқоиса бо асл (муваққатан хомӯш кардани коркард)"
VoiceStudio.Bypass.Tip="Қайд гузоред, то овозро бе коркард шунавед; қайдро бардоред, то онро баргардонед. Ҳамин тавр осон мефаҳмед, ки беҳтар шуд ё не."

VoiceStudio.InputGain="Баландии микрофон"
VoiceStudio.InputGain.Tip="Сигнали микрофонро то коркард чӣ қадар пурзӯр кардан. «Танзими зирак» онро худаш муқаррар мекунад. Агар овоз паст бошад — зиёд кунед, агар хиррос кунад — кам кунед."

VoiceStudio.Denoise="🤖 Коҳиши шовқин бо ЗС (шабакаи нейронии RNNoise 0.2)"
VoiceStudio.Denoise.Tip="Шабакаи нейронӣ овозро аз шовқин фарқ мекунад ва вентилятор, ғувиши компютер, кӯча, клавиатура ва акси садои ҳуҷраро тоза мекунад."
VoiceStudio.Denoise.Amount="Қувва"
VoiceStudio.Denoise.Amount.Tip="100% — шовқинро пурра тоза кардан. Агар овоз «мисли дар қубур» садо диҳад ё охири калимаҳо гум шаванд — то 70–85% кам кунед: каме заминаи табиӣ мемонад."

VoiceStudio.Gate="🚪 Гейти шовқин (хомӯшӣ дар таваққуфҳо)"
VoiceStudio.Gate.Tip="Вақте ки шумо хомӯшед, садоро паст мекунад: нафас, клики муш, садоҳои ҳуҷра байни ибораҳо."
VoiceStudio.Gate.Mode="Чӣ тавр фаҳмидан, ки шумо гап мезанед"
VoiceStudio.Gate.Mode.Voice="🤖 Аз рӯи овоз (ЗС) — тавсия мешавад"
VoiceStudio.Gate.Mode.Level="📶 Аз рӯи баландӣ (классикӣ)"
VoiceStudio.Gate.Mode.Both="🤖+📶 Овоз ва баландӣ (барои ҳуҷраҳои пуршовқин)"
VoiceStudio.Gate.Mode.Tip="«Аз рӯи овоз» — шабакаи нейронӣ маҳз нутқро мешунавад ва аз садои тугмаҳо гейтро намекушояд. «Аз рӯи баландӣ» — ҳар чизе, ки аз остона баландтар аст. «Овоз ва баландӣ» — ҳарду шарт якҷоя: аз ҳама сахттар."
VoiceStudio.Gate.Threshold="Остонаи хомӯшӣ"
VoiceStudio.Gate.Threshold.Tip="Ҳар чизе, ки аз ин сатҳ пасттар аст, таваққуф ҳисоб мешавад. Агар калимаҳои паст бурида шаванд — ба чап ҳаракат диҳед. Агар байни ибораҳо шовқин шунида шавад — ба рост. «Танзими зирак» худаш интихоб мекунад."
VoiceStudio.Gate.Range="Таваққуфҳоро чӣ қадар паст кардан"
VoiceStudio.Gate.Range.Tip="−20 дБ — таваққуфҳо хеле пасттар, вале табиӣ садо медиҳанд. −60 дБ — хомӯшии пурра. 0 — гейт ҳеҷ кор намекунад."
VoiceStudio.Gate.VadSens="Ҳассосият ба овоз"
VoiceStudio.Gate.VadSens.Tip="Баландтар — гейт ҳатто ба пичиррос кушода мешавад, пасттар — танҳо ба нутқи боварибахш."
VoiceStudio.Gate.Attack="Ҳамла (кушодашавӣ)"
VoiceStudio.Gate.Attack.Tip="Вақте ки шумо ба гап задан сар мекунед, гейт чӣ қадар зуд кушода мешавад."
VoiceStudio.Gate.Hold="Нигоҳдорӣ"
VoiceStudio.Gate.Hold.Tip="Пас аз анҷоми ибора гейт чӣ қадар кушода мемонад — то охири калимаҳо бурида нашаванд."
VoiceStudio.Gate.Release="Барқароршавӣ (пӯшидашавӣ)"
VoiceStudio.Gate.Release.Tip="Гейт пас аз ибора чӣ қадар ҳамвор пӯшида мешавад."

VoiceStudio.Eq="🎚 Эквалайзер (тембри овоз)"
VoiceStudio.Eq.Tip="Ранги овозро иваз мекунад: басомадҳои паст, возеҳӣ ва «ҳаво»-ро бештар ё камтар мекунад. «Танзими зирак» онро ба микрофони шумо мувофиқ мекунад."
VoiceStudio.Hpf="Тоза кардани ғувиши паст ва зарбаҳо"
VoiceStudio.Hpf.Tip="Пасттарин басомадҳоро мебурад: ғувиш, зарба ба миз, ларзиши поя, «пуф»-и нафас ба микрофон. Қариб ҳамеша фаъол гузоштан беҳтар аст."
VoiceStudio.Hpf.Freq="Буридани поёнтар аз"
VoiceStudio.Hpf.Freq.Tip="80 Гц — барои аксари овозҳо. 100–120 Гц — агар ғувиш зиёд бошад. Барои овозҳои пасти мардона аз 90 Гц баланд набардоред."
VoiceStudio.Hpf.Slope="Тезии буриш"
VoiceStudio.Hpf.Slope12="12 дБ/окт — нарм"
VoiceStudio.Hpf.Slope24="24 дБ/окт — тез"
VoiceStudio.Eq.Low="Умқ (бас)"
VoiceStudio.Eq.Low.Tip="Плюс — овоз бовиқортар ва «махмалинтар». Минус — агар овоз гулдурос кунад ё микрофон хеле наздик бошад."
VoiceStudio.Eq.LowFreq="Басомади «Умқ»"
VoiceStudio.Eq.Mud="Гулдурос (ғализии садо)"
VoiceStudio.Eq.Mud.Tip="Минус садои «картонӣ», «мисли дар қуттӣ»-и ҳуҷраро тоза мекунад — овоз тозатар мешавад. Одатан аз −2 то −4 мегузоранд."
VoiceStudio.Eq.MudFreq="Басомади «Гулдурос»"
VoiceStudio.Eq.MudQ="Паҳнои «Гулдурос»"
VoiceStudio.Eq.Q.Tip="Паҳнои банд (Q): камтар — васеътар ва нармтар, бештар — танг ва нуқтавӣ."
VoiceStudio.Eq.Nasal="Димоғӣ"
VoiceStudio.Eq.Nasal.Tip="Минус оҳанги «димоғӣ», «телефонӣ»-ро тоза мекунад. Плюс овозро дар миёна зичтар мекунад."
VoiceStudio.Eq.NasalFreq="Басомади «Димоғӣ»"
VoiceStudio.Eq.NasalQ="Паҳнои «Димоғӣ»"
VoiceStudio.Eq.Pres="Возеҳӣ (фаҳмоӣ)"
VoiceStudio.Eq.Pres.Tip="Плюс — калимаҳо возеҳтар ва «наздиктар» садо медиҳанд, овоз дар мусиқӣ ва бозӣ гум намешавад. Агар садо тез шавад — кам кунед."
VoiceStudio.Eq.PresFreq="Басомади «Возеҳӣ»"
VoiceStudio.Eq.PresQ="Паҳнои «Возеҳӣ»"
VoiceStudio.Eq.Air="Ҳаво (дурахш)"
VoiceStudio.Eq.Air.Tip="Плюс тозагӣ ва дурахши «гаронбаҳо»-и студиявӣ илова мекунад. Агар садои «ш-ш-ш» шунида шавад — кам кунед."
VoiceStudio.Eq.AirFreq="Басомади «Ҳаво»"
VoiceStudio.Eq.Lpf="Буридани болотар аз"
VoiceStudio.Eq.Lpf.Tip="Баландтарин басомадҳоро тоза мекунад. 20000 Гц — хомӯш. 3400 Гц — эффекти телефон."

VoiceStudio.Deess="🐍 Нарм кардани садоҳои тези ҳуштакдор (с, ш)"
VoiceStudio.Deess.Tip="Де-эссер танҳо садоҳои тези ҳуштакдорро паст мекунад ва ба боқимондаи овоз даст намерасонад."
VoiceStudio.Deess.Amount="Қувва"
VoiceStudio.Deess.Amount.Tip="Бештар — «с» ва «ш»-ро сахттар нарм мекунад. Агар «с» ғайритабиӣ садо диҳад — кам кунед."
VoiceStudio.Deess.Freq="Басомади садоҳои ҳуштакдор"
VoiceStudio.Deess.Freq.Tip="Аз кадом басомад садоҳои ҳуштакдор ҳисоб мешаванд. Одатан 5000–7000 Гц: дар овозҳои занона баландтар, дар мардона пасттар."

VoiceStudio.Comp="🗜 Баробар кардани баландӣ (компрессор)"
VoiceStudio.Comp.Tip="Калимаҳои паст ва баландро аз рӯи баландӣ ба ҳам наздик мекунад: овоз баробар, зич ва «радиоӣ» садо медиҳад, тамошобин лозим нест баландиро ҳамеша тағйир диҳад."
VoiceStudio.Comp.Amount="Қувва"
VoiceStudio.Comp.Amount.Tip="30–40% — табиӣ. 50–70% — зич, мисли радио. Баландтар — эффекти қавӣ. Баландии умумӣ худкор танзим мешавад."
VoiceStudio.Comp.Attack="Ҳамла"
VoiceStudio.Comp.Attack.Tip="Компрессор ба садои баланд чӣ қадар зуд вокуниш нишон медиҳад. Камтар — назорати сахттар, бештар — оғози калимаҳо зиндатар."
VoiceStudio.Comp.Release="Барқароршавӣ"
VoiceStudio.Comp.Release.Tip="Компрессор пас аз садои баланд чӣ қадар зуд «раҳо мекунад»."

VoiceStudio.Warmth="🔥 Гармӣ (ранги лампавӣ)"
VoiceStudio.Warmth.Tip="Мисли таҷҳизоти лампавии студиявӣ гармоникаҳои нарм илова мекунад: овоз зичтар ва махмалинтар мешавад."
VoiceStudio.Warmth.Amount="Қувва"
VoiceStudio.Warmth.Amount.Tip="20–40% — гармии сабук. Бештар — хирроси намоёни «винтажӣ»."

VoiceStudio.Voice="🎭 Тағйири овоз"
VoiceStudio.Voice.Tip="Тон ва «андоза»-и овозро иваз мекунад. Нигоҳ доштани формантҳо овозро табиӣ нигоҳ медорад — бе эффекти бурундук."
VoiceStudio.Voice.Pitch="Тони овоз"
VoiceStudio.Voice.Pitch.Tip="Бо нимтонҳо: −2 — каме пасттар, −12 — як октава пасттар, +12 — як октава баландтар. Барои садои табиӣ дар ҳудуди ±3 бимонед."
VoiceStudio.Voice.Formant="Тембр («андоза»-и овоз)"
VoiceStudio.Voice.Formant.Tip="Рангро бе тағйири тон иваз мекунад: минус — овоз «калонтар», калонсолтар ва мардонатар, плюс — «хурдтар», ҷавонтар."
VoiceStudio.Voice.Preserve="Нигоҳ доштани табиият (формантҳо)"
VoiceStudio.Voice.Preserve.Tip="Фаъол — ҳангоми иваз кардани тон тембр аз они шумо мемонад. Хомӯш — эффекти классикӣ: боло — бурундук, поён — навори сустшуда."
VoiceStudio.Voice.Quality="Сифат"
VoiceStudio.Voice.Quality.High="Баланд (таъхир ~43 мс)"
VoiceStudio.Voice.Quality.Fast="Тез (таъхир ~21 мс)"
VoiceStudio.Voice.Quality.Tip="Сифати баланд дар овозҳои паст беҳтар садо медиҳад. Тез ҳангоми шунидани худ таъхири камтар медиҳад."
