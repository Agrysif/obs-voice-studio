VoiceStudio.Guide="Ничек кулланырга — 3 адым:\n1. Әзер яңгырау стилен сайлагыз.\n2. «✨ Акыллы көйләү» төймәсенә басыгыз һәм 10 секунд гадәти тавыш белән, паузалар ясап сөйләгез.\n3. «🎧 Үземне тыңлау» төймәсенә басыгыз, колакчыннар киегез һәм шудыргычларны үз теләгегезчә күчерегез.\nИсем янындагы ярдәм билгесенә тычканны китерегез — анда һәр шудыргычның нәрсә эшләве аңлатылган."

VoiceStudio.Preset="Яңгырау стиле"
