VoiceStudio.Preset.Minimal="🧹 Шауны гына бетерү"
VoiceStudio.Preset.Minimal.Tip="Тавыш үзгәрми — нейрочелтәр шауны һәм түбән гөрелдәүне генә бетерә. Үз микрофоны ничек бар, шулай ошаганнар өчен."
VoiceStudio.Preset.Phone="📞 Эффект: телефон / рация"
VoiceStudio.Preset.Phone.Tip="Җиңелчә хырылдаулы тар «телефон» тавышы — сценкалар һәм роликлар өчен."
VoiceStudio.Preset.Monster="👹 Эффект: дию"
