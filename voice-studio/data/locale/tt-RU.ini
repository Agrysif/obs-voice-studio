VoiceStudio.Preset.Natural="🌿 Табигый һәм саф"
VoiceStudio.Preset.Natural.Tip="Артык «эффектлар» булмаган саф табигый тавыш: шауны, гөрелдәүне һәм ысылдаулы авазларны бетерә, сүзләрне бераз ачыграк итә. Бөтен нәрсәгә диярлек ярый."
VoiceStudio.Preset.Podcast="🎙 Подкаст / радио алып баручы"
VoiceStudio.Preset.Podcast.Tip="Радиодагыча тыгыз, якын, «кыйммәтле» тавыш: аста күбрәк бәрхет, тигез тавыш көче, җиңел лампа җылысы."
VoiceStudio.Preset.Stream="🎮 Стрим һәм уеннар"
