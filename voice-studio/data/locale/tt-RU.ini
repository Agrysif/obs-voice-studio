VoiceStudio.Calib.NoVoice="⚠ Тавышны ишетеп булмады. Чыганакта кирәкле микрофон сайланганын, аның Windows-та сүндерелмәгәнен тикшерегез һәм анализ вакытында сөйләгез. Аннары көйләүне яңадан җибәрегез."
VoiceStudio.Calib.Done="✅ Әзер! Тавыш: %.0f дБ, бүлмә шавы: %.0f дБ (запас %.0f дБ). Микрофон көчәйтүе: %+.1f дБ.\nШудыргычлар тавышыгызга көйләнде — тыңлауны кабызып бәяләгез."
