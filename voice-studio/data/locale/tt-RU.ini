VoiceStudio.Preset.Bright="✨ Якты һәм яңгыравык"
VoiceStudio.Preset.Bright.Tip="Саф, «һавалы», ялтыравыклы тавыш — тонык микрофоннар һәм караңгы тавышлар өчен яхшы."
VoiceStudio.Preset.Noisy="🏠 Шаулы бүлмә"
