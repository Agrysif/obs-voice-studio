VoiceStudio.Calib.Listening="🎙 Тыңлыйм… Гадәти тавыш белән сөйләгез, җөмләләр арасында паузалар ясагыз. %d сек калды.\n(Санау кузгалмаса — фильтр кабызылганын һәм микрофон эшләгәнен тикшерегез.)"
