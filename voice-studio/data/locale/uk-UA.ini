VoiceStudio.FilterName="🎙 Голосова студія"
VoiceStudio.Description="Студійна обробка голосу для запису та стрімів: ШІ-шумозаглушення, розумне автоналаштування, еквалайзер, компресор, де-есер, зміна голосу."

VoiceStudio.Unit.dB=" дБ"
VoiceStudio.Unit.Hz=" Гц"
VoiceStudio.Unit.ms=" мс"
VoiceStudio.Unit.Percent=" %"
VoiceStudio.Unit.Semitones=" пт"

VoiceStudio.Mode="Режим налаштувань"
VoiceStudio.Mode.Simple="🙂 Простий — лише головне"
VoiceStudio.Mode.Expert="🛠 Експерт — усі параметри"
VoiceStudio.Mode.Tip="Простий режим показує лише зрозумілі повзунки. Експерт додає частоти, добротність, час атаки й відновлення. Звук від перемикання режиму не змінюється."

VoiceStudio.Guide="Як користуватися — 3 кроки:\n1. Оберіть готовий стиль звучання.\n2. Натисніть «✨ Розумне налаштування» і 10 секунд говоріть звичайним голосом, з паузами.\n3. Натисніть «🎧 Слухати себе», надягніть навушники й рухайте повзунки на свій смак.\nНаведіть мишу на значок підказки поруч із назвою — там пояснено, що робить кожен повзунок."

VoiceStudio.Preset="Стиль звучання"
VoiceStudio.Preset.Tip="Готові налаштування для різних завдань. Коли ви обираєте стиль, повзунки нижче виставляються автоматично. Гучність мікрофона й поріг гейта при цьому не змінюються — їх підбирає «Розумне налаштування»."
VoiceStudio.Preset.Natural="🌿 Природний і чистий"
VoiceStudio.Preset.Natural.Tip="Чистий природний голос без «ефектів»: прибирає шум, гул і шиплячі, трохи додає розбірливості. Підходить майже для всього."
VoiceStudio.Preset.Podcast="🎙 Подкаст / радіоведучий"
VoiceStudio.Preset.Podcast.Tip="Щільний, близький, «дорогий» голос як на радіо: більше оксамиту внизу, рівна гучність, легке лампове тепло."
VoiceStudio.Preset.Stream="🎮 Стрім та ігри"
VoiceStudio.Preset.Stream.Tip="Максимум розбірливості й жодного шуму: голос пробивається крізь звук гри, клавіатуру й вентилятор не чути."
VoiceStudio.Preset.Deep="🌙 Глибокий оксамитовий"
VoiceStudio.Preset.Deep.Tip="Голос звучить нижче й солідніше завдяки тембру (без зміни висоти): більше низів, тепліше, м'якше."
VoiceStudio.Preset.Bright="✨ Яскравий і дзвінкий"
VoiceStudio.Preset.Bright.Tip="Свіжий, «повітряний» голос із блиском — добре для глухих мікрофонів і темних голосів."
VoiceStudio.Preset.Noisy="🏠 Шумна кімната"
VoiceStudio.Preset.Noisy.Tip="Для шумного приміщення: вентилятор, вулиця, механічна клавіатура. Найсильніше шумозаглушення й суворий гейт."
VoiceStudio.Preset.Minimal="🧹 Лише прибрати шум"
VoiceStudio.Preset.Minimal.Tip="Голос не змінюється — нейромережа лише прибирає шум і низький гул. Для тих, кому подобається свій мікрофон як є."
VoiceStudio.Preset.Phone="📞 Ефект: телефон / рація"
VoiceStudio.Preset.Phone.Tip="Вузький «телефонний» звук із легким хрипом — для сценок і роликів."
VoiceStudio.Preset.Monster="👹 Ефект: монстр"
VoiceStudio.Preset.Monster.Tip="Низький величезний голос: висота −5, «розмір» голосу більший. Для жартів і персонажів."
VoiceStudio.Preset.Cartoon="🐿 Ефект: мультяшний"
VoiceStudio.Preset.Cartoon.Tip="Високий веселий голос персонажа мультфільму."
VoiceStudio.Preset.Custom="🛠 Власне налаштування"
VoiceStudio.Preset.Custom.Tip="Повзунки не змінюються — налаштовуйте все самі."

VoiceStudio.Calib.Start="✨ Розумне налаштування під мій голос (10 с)"
VoiceStudio.Calib.Stop="⏹ Зупинити аналіз"
VoiceStudio.Calib.Tip="Плагін слухатиме мікрофон 10 секунд. Нейромережа сама відокремить мовлення від пауз, виміряє гучність голосу, шум кімнати, шиплячі й тембр, а потім підлаштує підсилення, шумозаглушення, гейт, компресор, де-есер і еквалайзер. Можна запускати повторно — поправки не накопичуються."
VoiceStudio.Calib.Hint="Натисніть кнопку вище й говоріть звичайним голосом із невеликими паузами — наприклад, розкажіть, що збираєтеся записувати."
VoiceStudio.Calib.Listening="🎙 Слухаю… Говоріть звичайним голосом, робіть паузи між фразами. Залишилося %d с.\n(Якщо відлік стоїть на місці — перевірте, що фільтр увімкнено й мікрофон працює.)"
VoiceStudio.Calib.Cancelled="Аналіз зупинено. Налаштування не змінилися."
VoiceStudio.Calib.NoVoice="⚠ Не вдалося почути голос. Перевірте, що в джерелі вибрано потрібний мікрофон, він не вимкнений у Windows, і говоріть під час аналізу. Потім запустіть налаштування ще раз."
VoiceStudio.Calib.Done="✅ Готово! Голос: %.0f дБ, шум кімнати: %.0f дБ (запас %.0f дБ). Підсилення мікрофона: %+.1f дБ.\nПовзунки підлаштовано під ваш голос — увімкніть прослуховування й оцініть."
VoiceStudio.Calib.TooQuiet="⚠ Мікрофон звучить дуже тихо. Збільште його рівень у Windows (Настройки → Звук → Вхід → Гучність) або на звуковій карті й повторіть налаштування."
VoiceStudio.Calib.Clipping="⚠ Мікрофон перевантажується (хрипить на гучних словах). Зменште його рівень у Windows або на звуковій карті й повторіть налаштування."
VoiceStudio.Calib.Noisy="ℹ У кімнаті досить шумно — шумозаглушення ввімкнено на повну. Спробуйте стиль «🏠 Шумна кімната»."
VoiceStudio.Calib.QuietRoom="👍 У кімнаті чудова тиша."

VoiceStudio.Monitor.On="🎧 Слухати себе (увімкнути прослуховування)"
VoiceStudio.Monitor.Off="🔇 Вимкнути прослуховування"
VoiceStudio.Monitor.Tip="Вмикає в OBS «Моніторинг і вивід» для цього мікрофона: ви чуєте себе вже з обробкою й одразу розумієте, як рухати повзунки. Обов'язково в навушниках!"
VoiceStudio.Monitor.Info="Звук прослуховування йде на: %s. Надягніть навушники — інакше мікрофон почує колонки, і з'явиться луна або свист. Пристрій можна змінити в «Налаштування → Аудіо → Розширені». Невелика затримка під час прослуховування — це нормально, у записі її немає."
VoiceStudio.Monitor.DefaultDevice="типовий пристрій"

VoiceStudio.Bypass="🔁 Порівняти з оригіналом (тимчасово вимкнути обробку)"
VoiceStudio.Bypass.Tip="Поставте позначку, щоб почути голос без обробки, зніміть — щоб повернути. Так легко зрозуміти, чи стало краще."

VoiceStudio.InputGain="Гучність мікрофона"
VoiceStudio.InputGain.Tip="Наскільки підсилити сигнал мікрофона до обробки. «Розумне налаштування» виставляє його автоматично. Якщо голос тихий — додайте, якщо хрипить — зменште."

VoiceStudio.Denoise="🤖 ШІ-шумозаглушення (нейромережа RNNoise 0.2)"
VoiceStudio.Denoise.Tip="Нейромережа відрізняє голос від шуму й прибирає вентилятор, гул комп'ютера, вулицю, клавіатуру, луну кімнати."
VoiceStudio.Denoise.Amount="Сила"
VoiceStudio.Denoise.Amount.Tip="100% — прибрати шум повністю. Якщо голос звучить «як у трубі» або ковтає закінчення — зменште до 70–85%: трохи природного фону залишиться."

VoiceStudio.Gate="🚪 Шумовий гейт (тиша в паузах)"
VoiceStudio.Gate.Tip="Приглушує звук, коли ви мовчите: дихання, клацання миші, звуки кімнати між фразами."
VoiceStudio.Gate.Mode="Як визначати, що ви говорите"
VoiceStudio.Gate.Mode.Voice="🤖 За голосом (ШІ) — рекомендовано"
VoiceStudio.Gate.Mode.Level="📶 За гучністю (класичний)"
VoiceStudio.Gate.Mode.Both="🤖+📶 Голос і гучність (для шумних кімнат)"
VoiceStudio.Gate.Mode.Tip="«За голосом» — нейромережа чує саме мовлення й не відкриває гейт на стук клавіш. «За гучністю» — усе, що гучніше за поріг. «Голос і гучність» — обидві умови одночасно: найсуворіший варіант."
VoiceStudio.Gate.Threshold="Поріг тиші"
VoiceStudio.Gate.Threshold.Tip="Усе, що тихіше за цей рівень, вважається паузою. Якщо обрізаються тихі слова — посуньте вліво. Якщо між фразами чути шум — вправо. Підбирається «Розумним налаштуванням»."
VoiceStudio.Gate.Range="Наскільки приглушувати паузи"
VoiceStudio.Gate.Range.Tip="−20 дБ — паузи помітно тихіші, але звучить природно. −60 дБ — повна тиша. 0 — гейт нічого не робить."
VoiceStudio.Gate.VadSens="Чутливість до голосу"
VoiceStudio.Gate.VadSens.Tip="Вище — гейт відкривається навіть на шепіт, нижче — лише на впевнене мовлення."
VoiceStudio.Gate.Attack="Атака (відкриття)"
VoiceStudio.Gate.Attack.Tip="Як швидко гейт відкривається, коли ви почали говорити."
VoiceStudio.Gate.Hold="Утримання"
VoiceStudio.Gate.Hold.Tip="Скільки гейт залишається відкритим після кінця фрази — щоб не обрізати закінчення слів."
VoiceStudio.Gate.Release="Відновлення (закриття)"
VoiceStudio.Gate.Release.Tip="Як плавно гейт закривається після фрази."

VoiceStudio.Eq="🎚 Еквалайзер (тембр голосу)"
VoiceStudio.Eq.Tip="Змінює забарвлення голосу: більше чи менше низів, розбірливості, «повітря». «Розумне налаштування» підлаштовує його під ваш мікрофон."
VoiceStudio.Hpf="Прибрати низький гул і стуки"
VoiceStudio.Hpf.Tip="Зрізає найнижчі частоти: гул, стук по столу, вібрацію стійки, «бубніння» від дихання в мікрофон. Майже завжди варто залишати ввімкненим."
VoiceStudio.Hpf.Freq="Зрізати нижче"
VoiceStudio.Hpf.Freq.Tip="80 Гц — для більшості голосів. 100–120 Гц — якщо багато гулу. Для низьких чоловічих голосів не піднімайте вище за 90 Гц."
VoiceStudio.Hpf.Slope="Крутизна зрізу"
VoiceStudio.Hpf.Slope12="12 дБ/окт — м'яко"
VoiceStudio.Hpf.Slope24="24 дБ/окт — різко"
VoiceStudio.Eq.Low="Глибина (бас)"
VoiceStudio.Eq.Low.Tip="Плюс — голос солідніший і «оксамитовіший». Мінус — якщо голос бубонить або мікрофон надто близько."
VoiceStudio.Eq.LowFreq="Частота «Глибини»"
VoiceStudio.Eq.Mud="Гулкість (бубніння)"
VoiceStudio.Eq.Mud.Tip="Мінус прибирає «картонний», «бочковий» призвук кімнати — голос стає чистішим. Зазвичай ставлять від −2 до −4."
VoiceStudio.Eq.MudFreq="Частота «Гулкості»"
VoiceStudio.Eq.MudQ="Ширина «Гулкості»"
VoiceStudio.Eq.Q.Tip="Ширина смуги (добротність): менше — ширше й м'якше, більше — вузько й точково."
VoiceStudio.Eq.Nasal="Гугнявість"
VoiceStudio.Eq.Nasal.Tip="Мінус прибирає «носовий», «телефонний» відтінок. Плюс робить голос щільнішим у середині."
VoiceStudio.Eq.NasalFreq="Частота «Гугнявості»"
VoiceStudio.Eq.NasalQ="Ширина «Гугнявості»"
VoiceStudio.Eq.Pres="Чіткість (розбірливість)"
VoiceStudio.Eq.Pres.Tip="Плюс — слова звучать чіткіше й «ближче», голос не тоне в музиці та грі. Якщо звук стає різким — зменште."
VoiceStudio.Eq.PresFreq="Частота «Чіткості»"
VoiceStudio.Eq.PresQ="Ширина «Чіткості»"
VoiceStudio.Eq.Air="Повітря (блиск)"
VoiceStudio.Eq.Air.Tip="Плюс додає свіжості й «дорогого» студійного блиску. Якщо стало чути шипіння — зменште."
VoiceStudio.Eq.AirFreq="Частота «Повітря»"
VoiceStudio.Eq.Lpf="Зрізати вище"
VoiceStudio.Eq.Lpf.Tip="Прибирає найвищі частоти. 20000 Гц — вимкнено. 3400 Гц — ефект телефону."

VoiceStudio.Deess="🐍 Прибрати різкі шиплячі (с, ш, щ)"
VoiceStudio.Deess.Tip="Де-есер приглушує лише різкі свистячі й шиплячі звуки, не зачіпаючи решту голосу."
VoiceStudio.Deess.Amount="Сила"
VoiceStudio.Deess.Amount.Tip="Більше — сильніше пом'якшує «с» і «ш». Якщо голос почав шепелявити — зменште."
VoiceStudio.Deess.Freq="Частота шиплячих"
VoiceStudio.Deess.Freq.Tip="З якої частоти вважаються шиплячі. Зазвичай 5000–7000 Гц: у жіночих голосів вище, у чоловічих нижче."

VoiceStudio.Comp="🗜 Вирівнювання гучності (компресор)"
VoiceStudio.Comp.Tip="Робить тихі й гучні слова ближчими за гучністю: голос звучить рівно, щільно й «як на радіо», глядачам не треба крутити гучність."
VoiceStudio.Comp.Amount="Сила"
VoiceStudio.Comp.Amount.Tip="30–40% — природно. 50–70% — щільно, як на радіо. Вище — сильний ефект. Загальна гучність підлаштовується автоматично."
VoiceStudio.Comp.Attack="Атака"
VoiceStudio.Comp.Attack.Tip="Як швидко компресор реагує на гучний звук. Менше — жорсткіший контроль, більше — живіші початки слів."
VoiceStudio.Comp.Release="Відновлення"
VoiceStudio.Comp.Release.Tip="Як швидко компресор «відпускає» після гучного звуку."

VoiceStudio.Warmth="🔥 Тепло (лампове забарвлення)"
VoiceStudio.Warmth.Tip="Додає м'які гармоніки, як у лампового студійного обладнання: голос стає щільнішим і оксамитовішим."
VoiceStudio.Warmth.Amount="Сила"
VoiceStudio.Warmth.Amount.Tip="20–40% — легке тепло. Більше — помітний «вінтажний» хрип."

VoiceStudio.Voice="🎭 Зміна голосу"
VoiceStudio.Voice.Tip="Змінює висоту й «розмір» голосу. Збереження формант залишає голос природним — без ефекту бурундука."
VoiceStudio.Voice.Pitch="Висота голосу"
VoiceStudio.Voice.Pitch.Tip="У півтонах: −2 — трохи нижче, −12 — на октаву нижче, +12 — на октаву вище. Для природного звучання тримайтеся в межах ±3."
VoiceStudio.Voice.Formant="Тембр («розмір» голосу)"
VoiceStudio.Voice.Formant.Tip="Змінює забарвлення, не змінюючи висоти: мінус — голос «більший», доросліший і мужніший, плюс — «менший», молодший."
VoiceStudio.Voice.Preserve="Зберігати природність (форманти)"
VoiceStudio.Voice.Preserve.Tip="Увімкнено — під час зміни висоти тембр лишається вашим. Вимкнено — класичний ефект: угору — бурундук, униз — сповільнена плівка."
VoiceStudio.Voice.Quality="Якість"
VoiceStudio.Voice.Quality.High="Висока (затримка ~43 мс)"
VoiceStudio.Voice.Quality.Fast="Швидка (затримка ~21 мс)"
VoiceStudio.Voice.Quality.Tip="Висока краще звучить на низьких голосах. Швидка дає меншу затримку під час прослуховування себе."
VoiceStudio.Voice.Note="ℹ Зміна голосу додає невелику затримку звуку. Якщо на записі губи трохи не збігаються зі звуком, задайте в OBS «Розширені властивості аудіо → Зсув синхронізації» для відео або мікрофона."

VoiceStudio.OutputGain="Підсумкова гучність"
VoiceStudio.OutputGain.Tip="Гучність голосу на виході плагіна. Стежте за індикатором у мікшері OBS: мовлення має доходити до жовтої зони, але не до червоної."
VoiceStudio.Limiter="🛡 Захист від перевантаження (лімітер)"
VoiceStudio.Limiter.Tip="Не дає голосу «захрипіти» на крику, сміху чи кашлі. Краще завжди тримати ввімкненим."
VoiceStudio.Limiter.Ceiling="Стеля гучності"
VoiceStudio.Limiter.Ceiling.Tip="Максимальний рівень на виході. −1 дБ — стандартний безпечний запас."

VoiceStudio.Live.In="Вхід"
VoiceStudio.Live.Out="Вихід"
VoiceStudio.Live.Voice="ШІ чує голос"
VoiceStudio.Live.Silence="Тиша"
VoiceStudio.Live.NoSignal="Немає звуку з мікрофона"
VoiceStudio.Live.Off="Фільтр вимкнено"
VoiceStudio.Live.Squeeze="стиснення %1 дБ"
VoiceStudio.Live.GatePause="паузу приглушено"
VoiceStudio.Live.EqHint="Еквалайзер: тягніть точки мишею — вліво-вправо частота, вгору-вниз гучність, коліщатко над точкою — ширина, подвійне клацання — скидання. Сірим показано спектр вашого голосу."
VoiceStudio.Live.EqOff="Еквалайзер вимкнено — увімкніть його в розділі «Еквалайзер» нижче"
VoiceStudio.Live.Hpf="Зріз гулу"
VoiceStudio.Live.Low="Глибина"
VoiceStudio.Live.Mud="Гулкість"
VoiceStudio.Live.Nasal="Гугнявість"
VoiceStudio.Live.Pres="Чіткість"
VoiceStudio.Live.Air="Повітря"
VoiceStudio.Live.kHz=" кГц"

VoiceStudio.Update.Title="Оновлення «Голосової студії»"
VoiceStudio.Update.Available="Доступна нова версія «Голосової студії»: %1 (у вас %2)."
VoiceStudio.Update.WhatsNew="Що нового:"
VoiceStudio.Update.Install="Оновити"
VoiceStudio.Update.Later="Пізніше"
VoiceStudio.Update.Skip="Пропустити цю версію"
VoiceStudio.Update.Downloading="Завантажую й перевіряю оновлення…"
