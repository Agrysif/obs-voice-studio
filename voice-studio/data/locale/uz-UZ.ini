VoiceStudio.Live.Off="Filtr oʻchirilgan"
VoiceStudio.Live.Squeeze="siqish %1 dB"
VoiceStudio.Live.GatePause="pauza pasaytirildi"
VoiceStudio.Live.EqHint="Ekvalayzer: nuqtalarni sichqoncha bilan torting — chapga-oʻngga chastota, yuqoriga-pastga balandlik, nuqta ustida gʻildirak — kenglik, ikki marta bosish — tiklash. Kulrang bilan ovozingiz spektri koʻrsatilgan."
VoiceStudio.Live.EqOff="Ekvalayzer oʻchirilgan — uni quyidagi «Ekvalayzer» boʻlimida yoqing"
VoiceStudio.Live.Hpf="Gʻuvillashni kesish"
VoiceStudio.Live.Low="Chuqurlik"
