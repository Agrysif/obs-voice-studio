VoiceStudio.FilterName="🎙 Ovoz studiyasi"
VoiceStudio.Description="Yozuv va strimlar uchun studiya darajasida ovozga ishlov berish: SI bilan shovqinni bostirish, aqlli avtosozlash, ekvalayzer, kompressor, de-esser, ovozni oʻzgartirish."

VoiceStudio.Unit.dB=" dB"
VoiceStudio.Unit.Hz=" Hz"
VoiceStudio.Unit.ms=" ms"
VoiceStudio.Unit.Percent=" %"
VoiceStudio.Unit.Semitones=" yt"

VoiceStudio.Mode="Sozlash rejimi"
VoiceStudio.Mode.Simple="🙂 Oddiy — faqat asosiylari"
VoiceStudio.Mode.Expert="🛠 Ekspert — barcha parametrlar"
VoiceStudio.Mode.Tip="Oddiy rejimda faqat tushunarli slayderlar koʻrinadi. Ekspert rejimi chastotalar, Q (polosa kengligi), hujum va tiklanish vaqtlarini qoʻshadi. Rejimni almashtirish tovushni oʻzgartirmaydi."

VoiceStudio.Guide="Qanday foydalaniladi — 3 qadam:\n1. Tayyor ovoz uslubini tanlang.\n2. «✨ Aqlli sozlash» tugmasini bosing va 10 soniya odatdagi ovozingizda, pauzalar bilan gapiring.\n3. «🎧 Oʻzimni eshitish» tugmasini bosing, quloqchin taqing va slayderlarni didingizga qarab suring.\nSichqonchani nom yonidagi yordam belgisi ustiga olib boring — u yerda har bir slayder nima qilishi tushuntirilgan."

VoiceStudio.Preset="Ovoz uslubi"
VoiceStudio.Preset.Tip="Turli vazifalar uchun tayyor sozlamalar. Uslub tanlanganda pastdagi slayderlar avtomatik oʻrnatiladi. Mikrofon balandligi va geyt chegarasi oʻzgarmaydi — ularni «Aqlli sozlash» tanlaydi."
VoiceStudio.Preset.Natural="🌿 Tabiiy va toza"
VoiceStudio.Preset.Natural.Tip="Ortiqcha effektlarsiz toza, tabiiy ovoz: shovqin, gʻuvillash va oʻtkir «s» tovushlarini olib tashlaydi, aniqlikni biroz oshiradi. Deyarli hamma narsaga mos keladi."
VoiceStudio.Preset.Podcast="🎙 Podkast / radio boshlovchisi"
VoiceStudio.Preset.Podcast.Tip="Radiodagidek zich, yaqin, «qimmat» ovoz: pastda koʻproq baxmal, bir tekis balandlik, yengil lampali iliqlik."
VoiceStudio.Preset.Stream="🎮 Strim va oʻyinlar"
VoiceStudio.Preset.Stream.Tip="Maksimal aniqlik va hech qanday shovqin yoʻq: ovoz oʻyin tovushi orasidan aniq eshitiladi, klaviatura va ventilyator eshitilmaydi."
VoiceStudio.Preset.Deep="🌙 Chuqur, baxmal ovoz"
VoiceStudio.Preset.Deep.Tip="Ovoz tembr hisobiga pastroq va salobatliroq eshitiladi (toni oʻzgarmaydi): past chastotalar koʻproq, iliqroq, yumshoqroq."
VoiceStudio.Preset.Bright="✨ Yorqin va jarangdor"
VoiceStudio.Preset.Bright.Tip="Tetik, «havodor», yaltiroq ovoz — boʻgʻiq mikrofonlar va xira ovozlar uchun yaxshi."
VoiceStudio.Preset.Noisy="🏠 Shovqinli xona"
VoiceStudio.Preset.Noisy.Tip="Shovqinli joy uchun: ventilyator, koʻcha, mexanik klaviatura. Shovqin eng kuchli bostiriladi, geyt qatʼiy ishlaydi."
VoiceStudio.Preset.Minimal="🧹 Faqat shovqinni olib tashlash"
VoiceStudio.Preset.Minimal.Tip="Ovoz oʻzgarmaydi — neyron tarmoq faqat shovqin va past gʻuvillashni olib tashlaydi. Oʻz mikrofonini boricha yoqtiradiganlar uchun."
VoiceStudio.Preset.Phone="📞 Effekt: telefon / ratsiya"
VoiceStudio.Preset.Phone.Tip="Yengil xirillashli tor «telefon» ovozi — sahnachalar va videolar uchun."
VoiceStudio.Preset.Monster="👹 Effekt: maxluq"
VoiceStudio.Preset.Monster.Tip="Past, ulkan ovoz: ton −5, ovoz «oʻlchami» kattaroq. Hazillar va personajlar uchun."
VoiceStudio.Preset.Cartoon="🐿 Effekt: multfilm"
VoiceStudio.Preset.Cartoon.Tip="Multfilm qahramonining baland, quvnoq ovozi."
VoiceStudio.Preset.Custom="🛠 Oʻz sozlamam"
VoiceStudio.Preset.Custom.Tip="Slayderlar oʻzgarmaydi — hammasini oʻzingiz sozlang."

VoiceStudio.Calib.Start="✨ Aqlli sozlash — ovozimga moslash (10 soniya)"
VoiceStudio.Calib.Stop="⏹ Tahlilni toʻxtatish"
VoiceStudio.Calib.Tip="Plagin mikrofonni 10 soniya tinglaydi. Neyron tarmoq nutqni pauzalardan oʻzi ajratadi, ovoz balandligi, xona shovqini, oʻtkir «s» tovushlari va tembrni oʻlchaydi, soʻng kuchaytirish, shovqin bostirish, geyt, kompressor, de-esser va ekvalayzerni moslaydi. Qayta ishga tushirish mumkin — tuzatishlar ustma-ust yigʻilmaydi."
VoiceStudio.Calib.Hint="Yuqoridagi tugmani bosing va odatdagi ovozingizda kichik pauzalar bilan gapiring — masalan, nimani yozib olmoqchi ekaningizni aytib bering."
VoiceStudio.Calib.Listening="🎙 Tinglayapman… Odatdagi ovozingizda gapiring, iboralar orasida pauza qiling. %d soniya qoldi.\n(Agar hisob oʻzgarmasa — filtr yoqilganini va mikrofon ishlayotganini tekshiring.)"
VoiceStudio.Calib.Cancelled="Tahlil toʻxtatildi. Sozlamalar oʻzgarmadi."
VoiceStudio.Calib.NoVoice="⚠ Ovozni eshitib boʻlmadi. Manbada kerakli mikrofon tanlanganini, u Windowsʼda oʻchirilmaganini tekshiring va tahlil vaqtida gapiring. Soʻng sozlashni qaytadan ishga tushiring."
VoiceStudio.Calib.Done="✅ Tayyor! Ovoz: %.0f dB, xona shovqini: %.0f dB (zaxira %.0f dB). Mikrofon kuchaytirishi: %+.1f dB.\nSlayderlar ovozingizga moslandi — tinglashni yoqing va baholang."
VoiceStudio.Calib.TooQuiet="⚠ Mikrofon juda past eshitilyapti. Uning darajasini Windowsʼda (Sozlamalar → Tovush → Kirish → Ovoz balandligi) yoki ovoz kartasida oshiring va sozlashni takrorlang."
VoiceStudio.Calib.Clipping="⚠ Mikrofon haddan tashqari yuklanyapti (baland soʻzlarda xirillaydi). Uning darajasini Windowsʼda yoki ovoz kartasida pasaytiring va sozlashni takrorlang."
VoiceStudio.Calib.Noisy="ℹ Xonada ancha shovqin bor — shovqin bostirish toʻliq quvvatda yoqildi. «🏠 Shovqinli xona» uslubini sinab koʻring."
VoiceStudio.Calib.QuietRoom="👍 Xonada ajoyib sukunat."

VoiceStudio.Monitor.On="🎧 Oʻzimni eshitish (tinglashni yoqish)"
VoiceStudio.Monitor.Off="🔇 Tinglashni oʻchirish"
VoiceStudio.Monitor.Tip="OBSʼda ushbu mikrofon uchun audio monitoringni yoqadi: oʻzingizni ishlov berilgan holda eshitasiz va slayderlarni qanday surishni darhol tushunasiz. Albatta quloqchinda!"
VoiceStudio.Monitor.Info="Tinglash tovushi chiqadigan qurilma: %s. Quloqchin taqing — aks holda mikrofon karnaylarni eshitadi va aks-sado yoki chiyillash paydo boʻladi. Qurilmani «Sozlamalar → Audio → Kengaytirilgan» boʻlimida oʻzgartirish mumkin. Tinglashda biroz kechikish boʻlishi normal, yozuvda u boʻlmaydi."
VoiceStudio.Monitor.DefaultDevice="birlamchi qurilma"

VoiceStudio.Bypass="🔁 Asl ovoz bilan solishtirish (ishlov berishni vaqtincha oʻchirish)"
VoiceStudio.Bypass.Tip="Ovozni ishlov berilmagan holda eshitish uchun belgilang, qaytarish uchun belgini olib tashlang. Shunday qilib yaxshilangan-yaxshilanmaganini oson bilasiz."

VoiceStudio.InputGain="Mikrofon balandligi"
VoiceStudio.InputGain.Tip="Ishlov berishdan oldin mikrofon signalini qancha kuchaytirish. «Aqlli sozlash» uni oʻzi oʻrnatadi. Ovoz past boʻlsa — oshiring, xirillasa — pasaytiring."

VoiceStudio.Denoise="🤖 SI bilan shovqinni bostirish (RNNoise 0.2 neyron tarmogʻi)"
VoiceStudio.Denoise.Tip="Neyron tarmoq ovozni shovqindan ajratadi va ventilyator, kompyuter gʻuvillashi, koʻcha, klaviatura va xona aks-sadosini olib tashlaydi."
VoiceStudio.Denoise.Amount="Kuchi"
VoiceStudio.Denoise.Amount.Tip="100% — shovqinni butunlay olib tashlash. Agar ovoz «quvur ichidagidek» eshitilsa yoki soʻz oxirlari yutilib ketsa — 70–85% gacha kamaytiring: biroz tabiiy fon qoladi."

VoiceStudio.Gate="🚪 Shovqin geyti (pauzalarda sukunat)"
VoiceStudio.Gate.Tip="Siz jim turganingizda tovushni pasaytiradi: nafas, sichqoncha chiqillashi, iboralar orasidagi xona tovushlari."
VoiceStudio.Gate.Mode="Gapirayotganingizni qanday aniqlash"
VoiceStudio.Gate.Mode.Voice="🤖 Ovoz boʻyicha (SI) — tavsiya etiladi"
VoiceStudio.Gate.Mode.Level="📶 Balandlik boʻyicha (klassik)"
VoiceStudio.Gate.Mode.Both="🤖+📶 Ovoz va balandlik (shovqinli xonalar uchun)"
VoiceStudio.Gate.Mode.Tip="«Ovoz boʻyicha» — neyron tarmoq aynan nutqni eshitadi va klavishlar taqillaganda geytni ochmaydi. «Balandlik boʻyicha» — chegaradan baland boʻlgan hamma narsa. «Ovoz va balandlik» — ikkala shart birga: eng qatʼiysi."
VoiceStudio.Gate.Threshold="Sukunat chegarasi"
VoiceStudio.Gate.Threshold.Tip="Bu darajadan past boʻlgan hamma narsa pauza hisoblanadi. Past soʻzlar kesilib qolsa — chapga suring. Iboralar orasida shovqin eshitilsa — oʻngga. «Aqlli sozlash» oʻzi tanlaydi."
VoiceStudio.Gate.Range="Pauzalarni qanchalik pasaytirish"
VoiceStudio.Gate.Range.Tip="−20 dB — pauzalar sezilarli pastroq, lekin tabiiy eshitiladi. −60 dB — toʻliq sukunat. 0 — geyt hech narsa qilmaydi."
VoiceStudio.Gate.VadSens="Ovozga sezgirlik"
VoiceStudio.Gate.VadSens.Tip="Yuqoriroq — geyt hatto shivirlashda ham ochiladi, pastroq — faqat dadil nutqda."
VoiceStudio.Gate.Attack="Hujum (ochilish)"
VoiceStudio.Gate.Attack.Tip="Gapira boshlaganingizda geyt qanchalik tez ochiladi."
VoiceStudio.Gate.Hold="Ushlab turish"
VoiceStudio.Gate.Hold.Tip="Ibora tugagandan keyin geyt qancha vaqt ochiq turadi — soʻz oxirlari kesilmasligi uchun."
VoiceStudio.Gate.Release="Tiklanish (yopilish)"
VoiceStudio.Gate.Release.Tip="Iboradan keyin geyt qanchalik silliq yopiladi."

VoiceStudio.Eq="🎚 Ekvalayzer (ovoz tembri)"
VoiceStudio.Eq.Tip="Ovoz rangini oʻzgartiradi: past chastotalar, aniqlik va «havo» koʻproq yoki kamroq boʻladi. «Aqlli sozlash» uni mikrofoningizga moslaydi."
VoiceStudio.Hpf="Past gʻuvillash va taqillashlarni olib tashlash"
VoiceStudio.Hpf.Tip="Eng past chastotalarni kesadi: gʻuvillash, stolga urilish, shtativ titrashi, mikrofonga nafas urilganda chiqadigan «puf» tovushi. Deyarli har doim yoqilgan qoldirgan maʼqul."
VoiceStudio.Hpf.Freq="Bundan pastini kesish"
VoiceStudio.Hpf.Freq.Tip="80 Hz — koʻpchilik ovozlar uchun. 100–120 Hz — gʻuvillash koʻp boʻlsa. Past erkak ovozlari uchun 90 Hz dan yuqori qoʻymang."
VoiceStudio.Hpf.Slope="Kesish keskinligi"
VoiceStudio.Hpf.Slope12="12 dB/okt — yumshoq"
VoiceStudio.Hpf.Slope24="24 dB/okt — keskin"
VoiceStudio.Eq.Low="Chuqurlik (bas)"
VoiceStudio.Eq.Low.Tip="Plyus — ovoz salobatliroq va «baxmalroq». Minus — ovoz gʻumbirlasa yoki mikrofon juda yaqin boʻlsa."
VoiceStudio.Eq.LowFreq="«Chuqurlik» chastotasi"
VoiceStudio.Eq.Mud="Gʻumbirlash (loyqalik)"
VoiceStudio.Eq.Mud.Tip="Minus xonaning «karton», «bochka ichidagidek» tovushini olib tashlaydi — ovoz tozaroq boʻladi. Odatda −2 dan −4 gacha qoʻyiladi."
VoiceStudio.Eq.MudFreq="«Gʻumbirlash» chastotasi"
VoiceStudio.Eq.MudQ="«Gʻumbirlash» kengligi"
VoiceStudio.Eq.Q.Tip="Polosa kengligi (Q): kamroq — kengroq va yumshoqroq, koʻproq — tor va nuqtali."
VoiceStudio.Eq.Nasal="Burun ovozi"
VoiceStudio.Eq.Nasal.Tip="Minus «burundan gapirish», «telefondagidek» tusni olib tashlaydi. Plyus ovozni oʻrtada zichroq qiladi."
VoiceStudio.Eq.NasalFreq="«Burun ovozi» chastotasi"
VoiceStudio.Eq.NasalQ="«Burun ovozi» kengligi"
VoiceStudio.Eq.Pres="Aniqlik (tushunarlilik)"
VoiceStudio.Eq.Pres.Tip="Plyus — soʻzlar aniqroq va «yaqinroq» eshitiladi, ovoz musiqa va oʻyin ichida yoʻqolib ketmaydi. Tovush keskin boʻlib qolsa — kamaytiring."
VoiceStudio.Eq.PresFreq="«Aniqlik» chastotasi"
VoiceStudio.Eq.PresQ="«Aniqlik» kengligi"
VoiceStudio.Eq.Air="Havo (yaltiroqlik)"
VoiceStudio.Eq.Air.Tip="Plyus tetiklik va «qimmat» studiya yaltiroqligini qoʻshadi. Vishillash eshitila boshlasa — kamaytiring."
VoiceStudio.Eq.AirFreq="«Havo» chastotasi"
VoiceStudio.Eq.Lpf="Bundan yuqorisini kesish"
VoiceStudio.Eq.Lpf.Tip="Eng yuqori chastotalarni olib tashlaydi. 20000 Hz — oʻchirilgan. 3400 Hz — telefon effekti."

VoiceStudio.Deess="🐍 Oʻtkir vishillashni yumshatish (s, sh)"
VoiceStudio.Deess.Tip="De-esser faqat oʻtkir vishillovchi tovushlarni pasaytiradi, ovozning qolgan qismiga tegmaydi."
VoiceStudio.Deess.Amount="Kuchi"
VoiceStudio.Deess.Amount.Tip="Koʻproq — «s» va «sh» kuchliroq yumshatiladi. Agar ovoz chuchuk tilli boʻlib qolsa — kamaytiring."
VoiceStudio.Deess.Freq="Vishillash chastotasi"
VoiceStudio.Deess.Freq.Tip="Vishillovchi tovushlar qaysi chastotadan boshlanadi. Odatda 5000–7000 Hz: ayollar ovozida yuqoriroq, erkaklarda pastroq."

VoiceStudio.Comp="🗜 Balandlikni tekislash (kompressor)"
VoiceStudio.Comp.Tip="Past va baland soʻzlarni balandlik boʻyicha bir-biriga yaqinlashtiradi: ovoz bir tekis, zich va «radiodagidek» eshitiladi, tomoshabin ovozni burab oʻtirmaydi."
VoiceStudio.Comp.Amount="Kuchi"
VoiceStudio.Comp.Amount.Tip="30–40% — tabiiy. 50–70% — radiodagidek zich. Undan yuqori — kuchli effekt. Umumiy balandlik avtomatik moslanadi."
VoiceStudio.Comp.Attack="Hujum"
VoiceStudio.Comp.Attack.Tip="Kompressor baland tovushga qanchalik tez javob beradi. Kamroq — qattiqroq nazorat, koʻproq — soʻz boshlari jonliroq."
VoiceStudio.Comp.Release="Tiklanish"
VoiceStudio.Comp.Release.Tip="Baland tovushdan keyin kompressor qanchalik tez «qoʻyib yuboradi»."

VoiceStudio.Warmth="🔥 Iliqlik (lampali tus)"
VoiceStudio.Warmth.Tip="Lampali studiya uskunalaridagidek yumshoq garmonikalar qoʻshadi: ovoz zichroq va baxmalroq boʻladi."
VoiceStudio.Warmth.Amount="Kuchi"
VoiceStudio.Warmth.Amount.Tip="20–40% — yengil iliqlik. Koʻproq — sezilarli «vintaj» xirillash."

VoiceStudio.Voice="🎭 Ovozni oʻzgartirish"
VoiceStudio.Voice.Tip="Ovoz toni va «oʻlchami»ni oʻzgartiradi. Formantlarni saqlash ovozni tabiiy qoldiradi — burunduq effektisiz."
VoiceStudio.Voice.Pitch="Ovoz toni"
VoiceStudio.Voice.Pitch.Tip="Yarim tonlarda: −2 — biroz pastroq, −12 — bir oktava past, +12 — bir oktava baland. Tabiiy eshitilishi uchun ±3 oraligʻida qoling."
VoiceStudio.Voice.Formant="Tembr (ovoz «oʻlchami»)"
VoiceStudio.Voice.Formant.Tip="Tonni oʻzgartirmasdan ovoz rangini oʻzgartiradi: minus — ovoz «kattaroq», yoshi kattaroq va mardonavorroq, plyus — «kichikroq», yoshroq."
VoiceStudio.Voice.Preserve="Tabiiylikni saqlash (formantlar)"
VoiceStudio.Voice.Preserve.Tip="Yoqilgan — ton oʻzgarganda tembr sizniki boʻlib qoladi. Oʻchirilgan — klassik effekt: yuqoriga — burunduq, pastga — sekinlashtirilgan lenta."
VoiceStudio.Voice.Quality="Sifat"
VoiceStudio.Voice.Quality.High="Yuqori (kechikish ~43 ms)"
VoiceStudio.Voice.Quality.Fast="Tez (kechikish ~21 ms)"
VoiceStudio.Voice.Quality.Tip="Yuqori sifat past ovozlarda yaxshiroq eshitiladi. Tez rejim oʻzingizni tinglashda kamroq kechikish beradi."
VoiceStudio.Voice.Note="ℹ Ovozni oʻzgartirish tovushga biroz kechikish qoʻshadi. Agar yozuvda lablar tovushga biroz mos kelmasa, OBSʼdagi «Advanced Audio Properties → Sync Offset» (kengaytirilgan audio xususiyatlari → sinxronlash siljishi) orqali video yoki mikrofon uchun siljishni sozlang."

VoiceStudio.OutputGain="Yakuniy balandlik"
VoiceStudio.OutputGain.Tip="Plagin chiqishidagi ovoz balandligi. OBS ovoz aralashtirgichidagi indikatorga qarang: nutq sariq zonagacha yetsin, lekin qizilgacha emas."
VoiceStudio.Limiter="🛡 Haddan tashqari yuklanishdan himoya (limiter)"
VoiceStudio.Limiter.Tip="Qichqiriq, kulgi yoki yoʻtalda ovozning «xirillashiga» yoʻl qoʻymaydi. Doim yoqilgan holda saqlagan maʼqul."
VoiceStudio.Limiter.Ceiling="Maksimal balandlik"
VoiceStudio.Limiter.Ceiling.Tip="Chiqishdagi eng yuqori daraja. −1 dB — standart xavfsiz zaxira."

